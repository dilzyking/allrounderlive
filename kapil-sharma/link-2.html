<!DOCTYPE html><html lang="en">
<head>
  <title>Kapil Sharma</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="referrer" content="no-referrer"/>  <!-- Plyr CSS -->  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"/>  <!-- HLS.js -->  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>  <!-- Plyr JS -->  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>  <style>
    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .plyr {
      height: 100%;
      width: 100%;
    }

    /* 🎬 Poster Style */
    #poster {
      position: absolute;
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      object-fit: cover;
      z-index: 5;
      border-radius: 12px;
      transition: opacity 0.4s ease;
    }
  </style></head><body>
  <div class="video-container"><!-- 📸 Poster -->
<img id="poster" src="https://resize.indiatvnews.com/en/resize/newbucket/1200_-/2026/05/samay-raina-kapil-sharma-show-1-1777707522.jpg" />

<!-- 🎥 Video -->
<video autoplay playsinline muted id="player" controls preload="metadata"></video>

  </div>  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const video = document.getElementById("player");
      const poster = document.getElementById("poster");

      const source = "https://vkvd568.okcdn.ru/srcIp/152.59.146.81/pr/40/expires/1778217188883/srcAg/CHROME/fromCache/1/ms/45.136.21.183/mid/14271491418353/type/2/sig/FbFLKT5MXHQ/ct/29/urls/95.163.35.134/clientType/14/zs/43/id/14595304655601/ondemand/hls4_14595304655601.CPHRtLmtnwM48bnIiQRI8bnIiQRQKFgOpy_TDiYeU_4.m3u8";

      const defaultOptions = {
        autoplay: true,
        controls: [
          'play', 'rewind', 'fast-forward', 'progress',
          'current-time', 'mute', 'volume', 'settings', 'fullscreen'
        ],
        settings: ['quality']
      };

      let player;

      function setupPlayer(hls, qualities = []) {
        player = new Plyr(video, {
          ...defaultOptions,
          quality: qualities.length ? {
            default: qualities[0],
            options: qualities,
            forced: true,
            onChange: q => {
              hls.levels.forEach((level, index) => {
                if (level.height === q) {
                  hls.currentLevel = index;
                }
              });
            }
          } : {}
        });

        // 🔁 AUTO RESUME
        setInterval(() => {
          if (video.paused && video.readyState > 2) {
            video.play().catch(()=>{});
          }
        }, 3000);

        // 🔊 AUTO UNMUTE (on first interaction)
        const unmute = () => {
          video.muted = false;
          video.volume = 1;
          document.removeEventListener("click", unmute);
          document.removeEventListener("touchstart", unmute);
        };

        document.addEventListener("click", unmute);
        document.addEventListener("touchstart", unmute);
      }

      // 🎬 Hide Poster when video plays
      function hidePoster() {
        poster.style.opacity = "0";
        setTimeout(() => poster.style.display = "none", 400);
      }

      video.addEventListener("playing", hidePoster);
      video.addEventListener("play", hidePoster);

      if (Hls.isSupported()) {
        const hls = new Hls({
          autoStartLoad: true
        });

        hls.loadSource(source);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
          const availableQualities = data.levels.map(l => l.height).sort((a,b) => b - a);
          video.play().catch(()=>{});
          setupPlayer(hls, availableQualities);
        });

        // 🔥 AUTO RECOVER ON ERROR
        hls.on(Hls.Events.ERROR, function (_, data) {
          if (data.fatal) {
            hls.startLoad();
          }
        });

      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = source;
        video.addEventListener("loadedmetadata", () => {
          video.play().catch(()=>{});
          setupPlayer(null);
        });
      }
    });
  </script></body>
</html>
