name: Fetch Sportzfy Data & Generate Pages

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Fetch external JSON and generate pages
      run: |
        python fetch_and_generate.py
        
    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add world-sports/
        git add api/
        git diff --staged --quiet || (git commit -m "Auto-update: Sportzfy pages $(date +'%Y-%m-%d %H:%M:%S')" && git push)
