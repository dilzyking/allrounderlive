<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Willow Live Player</title>

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .player-header {
      background: rgba(11,13,15,0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2f3a;
      flex-shrink: 0;
      z-index: 10;
      min-height: 60px;
    }
    .back-btn {
      background: none;
      border: none;
      color: #f5af19;
      cursor: pointer;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-family: 'Inter', system-ui, sans-serif;
      text-decoration: none;
    }
    .back-btn:hover { color: #ffc44d; }
    .back-btn .material-icons { font-size: 1.5rem; }
    .player-match-info { flex: 1; min-width: 0; }
    .player-match-title {
      font-size: clamp(0.8rem, 1.2vw, 1.1rem);
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-match-subtitle {
      font-size: clamp(0.6rem, 0.9vw, 0.8rem);
      color: #8892a0;
    }
    .player-status {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #e74c3c;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .live-text {
      color: #e74c3c;
      font-size: clamp(0.6rem, 0.9vw, 0.8rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .video-container {
      flex: 1;
      position: relative;
      background: #000;
      width: 100%;
      min-height: 0;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
    .player-footer {
      background: rgba(11,13,15,0.95);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #2a2f3a;
      flex-shrink: 0;
    }
    .player-footer .info {
      font-size: 0.65rem;
      color: #4a5362;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .player-footer .drm-badge {
      font-size: 0.6rem;
      color: #5f6b7e;
      padding: 4px 12px;
      background: #1a1f26;
      border-radius: 12px;
    }
    .player-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8892a0;
      background: #000;
      z-index: 5;
    }
    .player-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #f5af19;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .player-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e74c3c;
      background: #000;
      z-index: 5;
      padding: 20px;
    }
    .player-error .error-icon { font-size: 3rem; margin-bottom: 16px; }
    .player-error .error-message { font-size: 1rem; margin-bottom: 8px; text-align: center; }
    .player-error .error-details { font-size: 0.8rem; color: #5f6b7e; text-align: center; max-width: 400px; }
    .player-error .retry-btn {
      margin-top: 20px;
      padding: 10px 30px;
      background: #f5af19;
      border: none;
      border-radius: 8px;
      color: #0b0d0f;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .player-error .retry-btn:hover { background: #ffc44d; }
    @media (max-width: 768px) {
      .player-header { padding: 8px 12px; min-height: 50px; gap: 8px; }
      .back-btn { padding: 4px 8px; }
      .back-btn .back-text { display: none; }
      .player-match-title { font-size: 0.75rem; }
      .player-match-subtitle { font-size: 0.55rem; }
      .player-footer { padding: 6px 12px; flex-direction: column; gap: 4px; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="player-header">
    <a href="index.html" class="back-btn" id="backToHome">
      <span class="material-icons">arrow_back</span>
      <span class="back-text">Back</span>
    </a>
    <div class="player-match-info">
      <div class="player-match-title" id="playerTitle">Loading...</div>
      <div class="player-match-subtitle" id="playerSubtitle">Willow Cricket</div>
    </div>
    <div class="player-status">
      <span class="live-dot"></span>
      <span class="live-text">LIVE</span>
    </div>
  </header>

  <div class="video-container" id="videoContainer">
    <video id="videoElement" playsinline preload="metadata"></video>
    <div class="player-loading" id="loadingState">
      <div class="spinner"></div>
      <span>Loading stream...</span>
    </div>
    <div class="player-error" id="errorState">
      <div class="error-icon">⚠️</div>
      <div class="error-message" id="errorMessage">Failed to load stream</div>
      <div class="error-details" id="errorDetails">Please try again or check your connection</div>
      <button class="retry-btn" id="retryBtn">Retry</button>
    </div>
  </div>

  <footer class="player-footer">
    <span class="info">
      <span class="material-icons">sports_cricket</span>
      Willow Live · Powered by Shaka Player
    </span>
    <span class="drm-badge">🔒 DRM · Clearkey</span>
  </footer>

  <script>
    // ====== API URL ======
    const API_URL = 'https://willow-api.sayanwork-studioo.workers.dev/';
    let allMatches = [];
    let playerInstance = null;
    let uiInstance = null;

    // ====== SAFE ID HELPER ======
    // MUST match the same fallback logic used when building links on the
    // listing page (willow-live.js -> getSafeStreamId), otherwise the id
    // in the URL will never match anything here.
    function getSafeStreamId(stream) {
      return stream.tvgId || stream.tvgName || stream.title || '';
    }

    // ====== GET TVG ID FROM URL ======
    function getTvgIdFromUrl() {
      console.log('📍 Full URL:', window.location.href);
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      console.log('📍 Raw id param from URL:', id);
      // id is already decoded by URLSearchParams, no need to decodeURIComponent again
      return id || null;
    }

    // ====== FETCH MATCH DATA ======
    async function fetchMatchData() {
      const tvgId = getTvgIdFromUrl();
      console.log('🔍 Looking for match with id:', tvgId);

      if (!tvgId) {
        showError('Invalid match ID', 'Please go back and select a valid match');
        return;
      }

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        console.log('📡 API Response received');

        if (data.error) throw new Error(data.message || 'Unknown error');

        allMatches = data.streams || [];
        console.log('📋 Total matches found:', allMatches.length);
        console.log('🔍 Available ids:', allMatches.map(m => getSafeStreamId(m)));

        // Find the match using the same safe-id logic used to build the link
        const stream = allMatches.find(match => getSafeStreamId(match) === tvgId);

        if (!stream) {
          console.error('❌ Match not found. Looking for:', tvgId);
          showError('Match not found', `No match found with ID: ${tvgId}`);
          return;
        }

        console.log('✅ Match found:', stream.title);

        if (!stream.streamUrl) {
          showError('Stream not available', 'This match does not have a valid stream URL');
          return;
        }

        // Update UI
        document.getElementById('playerTitle').textContent = stream.title || stream.tvgName || 'Willow Live';
        document.getElementById('playerSubtitle').textContent = stream.groupTitle || 'Cricket';

        // Load the stream
        await loadStream(stream);

      } catch (error) {
        console.error('❌ Fetch error:', error);
        showError('Failed to load match data', error.message);
      }
    }

    function showError(message, details) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('errorState').style.display = 'flex';
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorDetails').textContent = details || 'Please try again or check your connection';
    }

    function hideError() {
      document.getElementById('errorState').style.display = 'none';
    }

    // ====== LOAD STREAM ======
    async function loadStream(stream) {
      const videoEl = document.getElementById('videoElement');
      const videoContainer = document.getElementById('videoContainer');
      const loadingState = document.getElementById('loadingState');

      try {
        hideError();
        loadingState.style.display = 'flex';

        // Destroy existing player
        if (playerInstance) {
          try { await playerInstance.destroy(); } catch(e) {}
          playerInstance = null;
          uiInstance = null;
        }

        // Install polyfills
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          showError('Browser not supported', 'Please use a modern browser');
          return;
        }

        // Create player
        playerInstance = new shaka.Player(videoEl);
        await playerInstance.attach(videoEl);

        // Setup UI
        uiInstance = new shaka.ui.Overlay(playerInstance, videoContainer, videoEl);
        uiInstance.configure({
          controlPanelElements: [
            'play_pause', 'time_and_duration', 'mute', 'volume',
            'spacer', 'language', 'captions', 'picture_in_picture',
            'quality', 'fullscreen'
          ],
          volumeBarColors: {
            base: 'rgba(0, 136, 255, 0.3)',
            level: 'rgb(0, 136, 255)'
          },
          seekBarColors: {
            base: 'rgba(90, 0, 0, 0.3)',
            buffered: 'rgba(120, 0, 0, 0.6)',
            played: 'rgb(170, 0, 0)'
          }
        });

        // ====== DRM CONFIG ======
        // Extract license key from properties
        let licenseKey = '';
        if (stream.properties) {
          licenseKey = stream.properties['inputstream.adaptive.license_key'] || '';
        }

        console.log('🔑 License key from stream:', licenseKey);

        let drmConfig = {};
        if (licenseKey) {
          // FIX: split only on the FIRST colon, since the base64/hex key
          // itself can legitimately contain additional colons.
          const sepIndex = licenseKey.indexOf(':');
          if (sepIndex > -1) {
            const keyId = licenseKey.slice(0, sepIndex).trim();
            const key = licenseKey.slice(sepIndex + 1).trim();
            if (keyId && key) {
              drmConfig = {
                clearKeys: {
                  [keyId]: key
                }
              };
              console.log('✅ DRM Config set:', drmConfig);
            } else {
              console.warn('⚠️ Invalid license key format:', licenseKey);
            }
          } else {
            console.warn('⚠️ License key missing ":" separator:', licenseKey);
          }
        } else {
          console.warn('⚠️ No license key found in stream properties');
        }

        // ====== PLAYER CONFIGURATION ======
        playerInstance.configure({
          drm: drmConfig,
          streaming: {
            lowLatencyMode: true,
            bufferingGoal: 15,
            rebufferingGoal: 2,
            bufferBehind: 15,
            retryParameters: {
              timeout: 10000,
              maxAttempts: 5,
              baseDelay: 300,
              backoffFactor: 1.2
            },
            segmentRequestTimeout: 8000,
            segmentPrefetchLimit: 2,
            useNativeHlsOnSafari: true
          },
          manifest: {
            retryParameters: {
              timeout: 8000,
              maxAttempts: 3
            }
          }
        });

        // ====== ERROR HANDLER ======
        playerInstance.addEventListener('error', (event) => {
          console.error('❌ Shaka Player Error:', event.detail);
          const error = event.detail;
          let msg = 'Stream error';
          let details = `Error code: ${error.code}`;

          if (error.code === 6012) {
            msg = 'DRM license error - Check your key';
            details += ' - The content is encrypted and the license key may be invalid';
          } else if (error.code === 1002) {
            msg = 'Network error - Check your connection';
            details += ' - Unable to reach the stream server';
          } else if (error.code === 7000) {
            msg = 'Manifest error - Invalid stream URL';
            details += ' - The MPD manifest could not be loaded';
          } else if (error.code === 1003) {
            msg = 'Network timeout';
            details += ' - The server is taking too long to respond';
          }

          showError(msg, details);
          loadingState.style.display = 'none';
        });

        // ====== LOAD THE STREAM ======
        console.log('🎯 Loading stream URL:', stream.streamUrl);
        console.log('📦 Stream properties:', stream.properties);

        await playerInstance.load(stream.streamUrl);
        console.log('✅ Stream loaded successfully!');
        loadingState.style.display = 'none';

        // FIX: play() can throw AbortError if it races with another
        // pending play/load call (e.g. from the `autoplay` attribute).
        // The `autoplay` attribute was removed from the <video> tag above,
        // so this is now the single source of truth for starting playback.
        try {
          await videoEl.play();
        } catch (playErr) {
          console.warn('⚠️ Autoplay blocked or interrupted, user may need to press play:', playErr);
        }

      } catch (err) {
        console.error('❌ Player load error:', err);
        showError('Failed to load stream', err.message || 'Unknown error');
        loadingState.style.display = 'none';
      }
    }

    // ====== RETRY & BACK ======
    document.getElementById('retryBtn').addEventListener('click', function() {
      document.getElementById('errorState').style.display = 'none';
      fetchMatchData();
    });

    document.getElementById('backToHome').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'index.html';
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') window.location.href = 'index.html';
    });

    // ====== INIT ======
    console.log('🚀 Willow Player Starting...');
    fetchMatchData();
  </script>
</body>
</html>
