<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Willow Live Player</title>

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .player-header {
      background: rgba(11,13,15,0.95);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2a2f3a;
      flex-shrink: 0;
      z-index: 10;
      min-height: 60px;
    }
    .back-btn {
      background: none;
      border: none;
      color: #f5af19;
      cursor: pointer;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-family: 'Inter', system-ui, sans-serif;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-btn:hover { color: #ffc44d; }
    .back-btn .material-icons { font-size: 1.5rem; }
    .player-match-info { flex: 1; min-width: 0; }
    .player-match-title {
      font-size: clamp(0.8rem, 1.2vw, 1.1rem);
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-match-subtitle {
      font-size: clamp(0.6rem, 0.9vw, 0.8rem);
      color: #8892a0;
    }
    .player-status {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #e74c3c;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .live-text {
      color: #e74c3c;
      font-size: clamp(0.6rem, 0.9vw, 0.8rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .video-container {
      flex: 1;
      position: relative;
      background: #000;
      width: 100%;
      min-height: 0;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
    .player-footer {
      background: rgba(11,13,15,0.95);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #2a2f3a;
      flex-shrink: 0;
    }
    .player-footer .info {
      font-size: 0.65rem;
      color: #4a5362;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .player-footer .drm-badge {
      font-size: 0.6rem;
      color: #5f6b7e;
      padding: 4px 12px;
      background: #1a1f26;
      border-radius: 12px;
    }
    .player-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8892a0;
      background: #000;
      z-index: 5;
    }
    .player-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #f5af19;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    .player-loading .retry-info {
      font-size: 0.8rem;
      color: #5f6b7e;
      margin-top: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      .player-header { padding: 8px 12px; min-height: 50px; gap: 8px; }
      .back-btn { padding: 4px 8px; font-size: 0.8rem; }
      .back-btn .back-text { display: none; }
      .player-match-title { font-size: 0.75rem; }
      .player-match-subtitle { font-size: 0.55rem; }
      .player-footer { padding: 6px 12px; flex-direction: column; gap: 4px; text-align: center; }
    }
  </style>
</head>
<body>

  <header class="player-header">
    <a href="index.html" class="back-btn" id="backToHome">
      <span class="material-icons">arrow_back</span>
      <span class="back-text">Back</span>
    </a>
    <div class="player-match-info">
      <div class="player-match-title" id="playerTitle">Loading...</div>
      <div class="player-match-subtitle" id="playerSubtitle">Willow Cricket</div>
    </div>
    <div class="player-status">
      <span class="live-dot"></span>
      <span class="live-text">LIVE</span>
    </div>
  </header>

  <div class="video-container" id="videoContainer">
    <video id="videoElement" playsinline preload="metadata"></video>
    <div class="player-loading" id="loadingState">
      <div class="spinner"></div>
      <span>Loading stream...</span>
      <div class="retry-info" id="retryInfo"></div>
    </div>
  </div>

  <footer class="player-footer">
    <span class="info">
      <span class="material-icons">sports_cricket</span>
      Willow Live · Powered by Shaka Player
    </span>
    <span class="drm-badge">🔒 DRM · Clearkey</span>
  </footer>

  <script>
    // ============================================================
    // ====== WILLOW PLAYER - FULL SELF-CONTAINED ======
    // ============================================================

    // ====== CONFIGURATION ======
    const API_URL = 'https://willow-api.sayanwork-studioo.workers.dev/';
    const MAX_RETRIES_PER_STREAM = 2;
    
    // ====== STATE ======
    let allMatches = [];
    let playerInstance = null;
    let uiInstance = null;
    let currentStreamIndex = 0;
    let availableStreams = [];
    let streamRetryCount = 0;
    let currentDrmKey = null;
    let isLoading = false;

    // ====== DOM ELEMENTS ======
    const videoEl = document.getElementById('videoElement');
    const videoContainer = document.getElementById('videoContainer');
    const loadingState = document.getElementById('loadingState');
    const retryInfo = document.getElementById('retryInfo');
    const playerTitle = document.getElementById('playerTitle');
    const playerSubtitle = document.getElementById('playerSubtitle');

    // ====== SAFE ID HELPER ======
    function getSafeStreamId(match) {
      return match.tvgId || match.tvgName || match.title || match.match_id || '';
    }

    // ====== GET MATCH ID FROM URL ======
    function getMatchIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || null;
    }

    // ====== GET ALL STREAM URLS FROM MATCH ======
    function getAllStreamUrls(match) {
      const urls = [];
      
      // Check stream_url_alpha
      if (match.stream_url_alpha) {
        if (typeof match.stream_url_alpha === 'string' && match.stream_url_alpha) {
          urls.push(match.stream_url_alpha);
        } else if (typeof match.stream_url_alpha === 'object') {
          const servers = Object.values(match.stream_url_alpha);
          for (const url of servers) {
            if (url && typeof url === 'string' && url.startsWith('http')) {
              urls.push(url);
            }
          }
        }
      }
      
      // Check stream_url_bravo
      if (match.stream_url_bravo) {
        if (typeof match.stream_url_bravo === 'string' && match.stream_url_bravo) {
          urls.push(match.stream_url_bravo);
        } else if (typeof match.stream_url_bravo === 'object') {
          const servers = Object.values(match.stream_url_bravo);
          for (const url of servers) {
            if (url && typeof url === 'string' && url.startsWith('http')) {
              urls.push(url);
            }
          }
        }
      }
      
      return urls;
    }

    // ====== SHOW ERROR ======
    function showError(message, showBackButton = true) {
      loadingState.style.display = 'flex';
      loadingState.innerHTML = `
        <div style="color: #e74c3c; text-align: center; padding: 20px; max-width: 400px;">
          <span class="material-icons" style="font-size: 48px; display: block; margin-bottom: 12px;">error_outline</span>
          <p style="font-size: 16px; font-weight: 500; color: #ffffff;">${message}</p>
          ${showBackButton ? `
            <button onclick="window.location.href='index.html'" style="margin-top: 20px; padding: 12px 32px; background: #f5af19; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: 'Inter', system-ui, sans-serif; color: #0b0d0f;">
              ← Back to Home
            </button>
          ` : ''}
        </div>
      `;
    }

    // ====== SHOW LOADING ======
    function showLoading(message, retryCount = null) {
      loadingState.style.display = 'flex';
      loadingState.innerHTML = `
        <div class="spinner"></div>
        <span>${message}</span>
        ${retryCount !== null ? `<div class="retry-info">Attempt ${retryCount + 1}</div>` : ''}
      `;
    }

    // ====== FETCH MATCH DATA ======
    async function fetchMatchData() {
      const matchId = getMatchIdFromUrl();
      console.log('🔍 Looking for match with id:', matchId);

      if (!matchId) {
        showError('No match selected');
        return;
      }

      try {
        showLoading('Fetching match data...');

        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        console.log('📡 API Response received');

        if (data.error) throw new Error(data.message || 'Unknown error');

        // Get matches from the new JSON structure
        allMatches = data.Matches || data.streams || [];
        console.log('📋 Total matches found:', allMatches.length);

        // Find the match
        const match = allMatches.find(m => getSafeStreamId(m) === matchId);

        if (!match) {
          console.error('❌ Match not found. Looking for:', matchId);
          showError('Match not found');
          return;
        }

        console.log('✅ Match found:', match.title);

        // Check if match is LIVE
        if (match.status && match.status.toUpperCase() !== 'LIVE') {
          showError(`⏰ This match is ${match.status}. Check back when it starts.`);
          return;
        }

        // Update UI
        playerTitle.textContent = match.title || match.tvgName || 'Willow Live';
        playerSubtitle.textContent = match.synopsis || match.groupTitle || 'Cricket';

        // Get all available stream URLs
        availableStreams = getAllStreamUrls(match);
        
        if (availableStreams.length === 0) {
          showError('No streams available for this match');
          return;
        }

        console.log('📡 Available streams:', availableStreams.length);

        // Get DRM key
        currentDrmKey = match.drm_key || null;
        
        // Start loading with first stream
        currentStreamIndex = 0;
        streamRetryCount = 0;
        await loadStream();

      } catch (error) {
        console.error('❌ Fetch error:', error);
        showError('Failed to load match data');
      }
    }

    // ====== LOAD STREAM ======
    async function loadStream() {
      if (isLoading) return;
      isLoading = true;

      const streamUrl = availableStreams[currentStreamIndex];
      
      if (!streamUrl) {
        showError('No valid stream URL available');
        isLoading = false;
        return;
      }

      try {
        showLoading(
          `Loading stream ${currentStreamIndex + 1}/${availableStreams.length}...`,
          streamRetryCount
        );

        // Destroy existing player
        if (playerInstance) {
          try { 
            await playerInstance.destroy(); 
          } catch(e) {
            console.warn('Destroy error:', e);
          }
          playerInstance = null;
          uiInstance = null;
        }

        // Install polyfills
        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          showError('Browser not supported');
          isLoading = false;
          return;
        }

        // Create player
        playerInstance = new shaka.Player(videoEl);
        await playerInstance.attach(videoEl);

        // Setup UI
        uiInstance = new shaka.ui.Overlay(playerInstance, videoContainer, videoEl);
        uiInstance.configure({
          controlPanelElements: [
            'play_pause', 'time_and_duration', 'mute', 'volume',
            'spacer', 'language', 'captions', 'picture_in_picture',
            'quality', 'fullscreen'
          ],
          volumeBarColors: {
            base: 'rgba(0, 136, 255, 0.3)',
            level: 'rgb(0, 136, 255)'
          },
          seekBarColors: {
            base: 'rgba(90, 0, 0, 0.3)',
            buffered: 'rgba(120, 0, 0, 0.6)',
            played: 'rgb(170, 0, 0)'
          }
        });

        // ====== DRM CONFIG ======
        let drmConfig = {};
        if (currentDrmKey) {
          const sepIndex = currentDrmKey.indexOf(':');
          if (sepIndex > -1) {
            const keyId = currentDrmKey.slice(0, sepIndex).trim();
            const key = currentDrmKey.slice(sepIndex + 1).trim();
            if (keyId && key) {
              drmConfig = {
                clearKeys: {
                  [keyId]: key
                }
              };
              console.log('✅ DRM Config set');
            }
          }
        }

        // ====== PLAYER CONFIGURATION ======
        playerInstance.configure({
          drm: drmConfig,
          streaming: {
            lowLatencyMode: true,
            bufferingGoal: 15,
            rebufferingGoal: 2,
            bufferBehind: 15,
            retryParameters: {
              timeout: 10000,
              maxAttempts: 3,
              baseDelay: 300,
              backoffFactor: 1.2
            },
            segmentRequestTimeout: 8000,
            segmentPrefetchLimit: 2,
            useNativeHlsOnSafari: true
          },
          manifest: {
            retryParameters: {
              timeout: 8000,
              maxAttempts: 3
            }
          }
        });

        // ====== ERROR HANDLER ======
        playerInstance.addEventListener('error', async (event) => {
          const error = event.detail;
          console.error('❌ Shaka Player Error:', error);
          
          // Check if this is a retryable error
          const isRetryable = error.code === 1002 || // NETWORK
                              error.code === 1003 || // TIMEOUT
                              error.code === 1006 || // HTTP_ERROR
                              error.code === 1007 || // PARSE
                              error.code === 3001 || // SEGMENT_UNAVAILABLE
                              error.code === 3002;   // SEGMENT_SKIPPED

          if (isRetryable && streamRetryCount < MAX_RETRIES_PER_STREAM) {
            streamRetryCount++;
            console.log(`🔄 Retrying stream ${currentStreamIndex + 1} (${streamRetryCount}/${MAX_RETRIES_PER_STREAM})...`);
            await loadStream();
            return;
          }

          // Try next stream if available
          if (currentStreamIndex < availableStreams.length - 1) {
            currentStreamIndex++;
            streamRetryCount = 0;
            console.log(`🔄 Switching to stream ${currentStreamIndex + 1}/${availableStreams.length}...`);
            await loadStream();
          } else {
            // All streams failed
            showError('All streams failed. Please try again later.');
            isLoading = false;
          }
        });

        // ====== LOAD THE STREAM ======
        console.log('🎯 Loading stream URL:', streamUrl);
        await playerInstance.load(streamUrl);
        console.log('✅ Stream loaded successfully!');
        
        // Hide loading
        loadingState.style.display = 'none';
        isLoading = false;
        streamRetryCount = 0;

        // Start playback
        try {
          await videoEl.play();
        } catch (playErr) {
          console.warn('⚠️ Autoplay blocked:', playErr);
        }

      } catch (err) {
        console.error('❌ Player load error:', err);
        
        // Check if we should retry this stream
        if (streamRetryCount < MAX_RETRIES_PER_STREAM) {
          streamRetryCount++;
          console.log(`🔄 Retrying stream ${currentStreamIndex + 1} (${streamRetryCount}/${MAX_RETRIES_PER_STREAM})...`);
          isLoading = false;
          await loadStream();
          return;
        }

        // Try next stream if available
        if (currentStreamIndex < availableStreams.length - 1) {
          currentStreamIndex++;
          streamRetryCount = 0;
          console.log(`🔄 Switching to stream ${currentStreamIndex + 1}/${availableStreams.length}...`);
          isLoading = false;
          await loadStream();
        } else {
          showError('Failed to load stream. Please try again later.');
          isLoading = false;
        }
      }
    }

    // ====== BACK BUTTON ======
    document.getElementById('backToHome').addEventListener('click', function(e) {
      e.preventDefault();
      if (playerInstance) {
        try { playerInstance.destroy(); } catch(e) {}
      }
      window.location.href = 'index.html';
    });

    // ====== KEYBOARD SHORTCUTS ======
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (playerInstance) {
          try { playerInstance.destroy(); } catch(e) {}
        }
        window.location.href = 'index.html';
      }
      if (e.key === 'f' || e.key === 'F') {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.body.requestFullscreen();
        }
      }
    });

    // ====== FULLSCREEN BUTTON ======
    // Add a custom fullscreen button to the UI
    // Shaka already has fullscreen button, but we'll add keyboard support

    // ====== HANDLE PAGE VISIBILITY ======
    document.addEventListener('visibilitychange', function() {
      if (document.hidden && playerInstance) {
        // Pause when tab is hidden to save bandwidth
        try { videoEl.pause(); } catch(e) {}
      }
    });

    // ====== HANDLE CONNECTION STATUS ======
    window.addEventListener('online', function() {
      console.log('🔄 Network reconnected');
      if (playerInstance) {
        // Try to reload the stream if it failed due to network
        // The error handler will handle this
      }
    });

    // ====== INIT ======
    console.log('🚀 Willow Player Starting...');
    console.log('📋 URL:', window.location.href);
    console.log('🔑 Match ID:', getMatchIdFromUrl());
    
    // Start the player
    fetchMatchData();

    // ====== EXPOSE FUNCTIONS FOR DEBUGGING ======
    window.__willowPlayer = {
      reload: fetchMatchData,
      retryStream: loadStream,
      getState: () => ({
        currentStreamIndex,
        availableStreams,
        streamRetryCount,
        isLoading,
        hasPlayer: !!playerInstance
      })
    };

    console.log('💡 Debug: window.__willowPlayer available');
  </script>
</body>
</html>
