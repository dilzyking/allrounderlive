<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>matchdekho</title>
  <style>
    /* ---------- RESET & BASE ---------- */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0b0d0f;
      --green: #7dffb3;
      --white: #ffffff;
      --border-subtle: rgba(255, 255, 255, 0.06);
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* ---------- HEADER - FULLY TRANSPARENT ---------- */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: clamp(0.4rem, 1.5vw, 0.8rem) clamp(0.8rem, 4vw, 3rem);
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 1000;
      border-bottom: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ---------- LOGO (SMALLER) ---------- */
    .logo {
      text-decoration: none;
      font-size: clamp(0.9rem, 2.8vw, 1.6rem);
      font-weight: 700;
      letter-spacing: clamp(-0.01em, -0.03em, -0.05em);
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      transition: transform 0.2s ease;
    }

    .logo:hover {
      transform: scale(1.02);
    }

    .logo .match {
      color: var(--green);
      text-shadow: 
        0 0 clamp(15px, 3vw, 40px) rgba(125, 255, 179, 0.15),
        0 0 clamp(30px, 6vw, 80px) rgba(125, 255, 179, 0.05);
    }

    .logo .dekho {
      color: var(--white);
      text-shadow: 0 0 clamp(8px, 1.5vw, 25px) rgba(255, 255, 255, 0.05);
    }

    /* ---------- POSTER SECTION - TOUCHES TOP ---------- */
    .poster-wrapper {
      position: relative;
      width: 100%;
      margin-top: 0;
      z-index: 1;
      overflow: hidden;
    }

    .poster-section {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 0;
      margin: 0;
      min-height: clamp(50vh, 65vh, 80vh);
      background: var(--bg-primary);
    }

    .poster-image {
      width: 100%;
      height: auto;
      min-height: clamp(50vh, 65vh, 80vh);
      object-fit: cover;
      display: block;
      margin: 0;
      padding: 0;
      transition: all 0.3s ease;
    }

    /* ---------- BLACK GRADIENT OVERLAY (OTT STYLE) ---------- */
    .gradient-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: clamp(40%, 55%, 70%);
      background: linear-gradient(
        to top,
        #0b0d0f 0%,
        #0b0d0f 15%,
        rgba(11, 13, 15, 0.85) 30%,
        rgba(11, 13, 15, 0.5) 50%,
        rgba(11, 13, 15, 0.2) 70%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 2;
    }

    /* ---------- GLASS CLOUDS ---------- */
    .glass-cloud {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(clamp(30px, 6vw, 60px));
      will-change: transform, opacity;
    }

    .cloud-1 {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 700px);
      height: min(50vh, 400px);
      background: radial-gradient(
        ellipse at center,
        rgba(125, 255, 179, 0.05) 0%,
        rgba(255, 255, 255, 0.025) 40%,
        transparent 70%
      );
      animation: pulse 4s ease-in-out infinite;
    }

    .cloud-2 {
      top: clamp(10%, 15vh, 25%);
      left: clamp(5%, 8vw, 15%);
      width: clamp(150px, 25vw, 350px);
      height: clamp(100px, 18vh, 250px);
      background: radial-gradient(
        ellipse at center,
        rgba(125, 255, 179, 0.035) 0%,
        rgba(255, 255, 255, 0.02) 30%,
        transparent 70%
      );
      animation: float1 8s ease-in-out infinite;
    }

    .cloud-3 {
      bottom: clamp(10%, 12vh, 20%);
      right: clamp(3%, 5vw, 12%);
      width: clamp(180px, 28vw, 400px);
      height: clamp(120px, 20vh, 280px);
      background: radial-gradient(
        ellipse at center,
        rgba(125, 255, 179, 0.03) 0%,
        rgba(255, 255, 255, 0.015) 30%,
        transparent 70%
      );
      animation: float2 10s ease-in-out infinite reverse;
    }

    .cloud-4 {
      top: clamp(60%, 65vh, 75%);
      left: clamp(2%, 3vw, 8%);
      width: clamp(100px, 15vw, 200px);
      height: clamp(70px, 10vh, 150px);
      background: radial-gradient(
        ellipse at center,
        rgba(125, 255, 179, 0.02) 0%,
        rgba(255, 255, 255, 0.01) 30%,
        transparent 70%
      );
      animation: float3 12s ease-in-out infinite 2s;
      filter: blur(clamp(40px, 5vw, 70px));
    }

    /* ---------- ANIMATIONS ---------- */
    @keyframes pulse {
      0%, 100% {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    @keyframes float1 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(clamp(10px, 2vw, 30px), clamp(-10px, -2vh, -25px)) scale(1.02);
      }
      66% {
        transform: translate(clamp(-5px, -1vw, -15px), clamp(5px, 1vh, 15px)) scale(0.98);
      }
    }

    @keyframes float2 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(clamp(-15px, -3vw, -40px), clamp(-12px, -2.5vh, -30px)) scale(1.05);
      }
    }

    @keyframes float3 {
      0%, 100% {
        transform: translate(0, 0) rotate(0deg);
      }
      50% {
        transform: translate(clamp(20px, 4vw, 50px), clamp(8px, 1.5vh, 20px)) rotate(5deg);
      }
    }

    /* ---------- MAIN ---------- */
    main {
      flex: 1;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      position: relative;
      z-index: 1;
      background: var(--bg-primary);
    }

    /* ============================================================ */
    /* ========== RESPONSIVE POSTER - TOUCHES TOP ========== */
    /* ============================================================ */

    /* ----- MOBILE: PORTRAIT ----- */
    @media (orientation: portrait) and (max-width: 768px) {
      header {
        padding: clamp(0.3rem, 1.2vw, 0.5rem) clamp(0.6rem, 3vw, 1.2rem);
      }

      .logo {
        font-size: clamp(0.8rem, 3.5vw, 1.2rem);
      }

      .poster-section {
        min-height: clamp(55vh, 68vh, 82vh);
      }

      .poster-image {
        min-height: clamp(55vh, 68vh, 82vh);
        object-fit: cover;
        width: 100%;
      }

      .gradient-overlay {
        height: clamp(45%, 60%, 75%);
        background: linear-gradient(
          to top,
          #0b0d0f 0%,
          #0b0d0f 12%,
          rgba(11, 13, 15, 0.85) 25%,
          rgba(11, 13, 15, 0.5) 45%,
          rgba(11, 13, 15, 0.2) 65%,
          transparent 100%
        );
      }
    }

    /* ----- MOBILE: PORTRAIT (small phones) ----- */
    @media (orientation: portrait) and (max-width: 480px) {
      header {
        padding: 0.25rem 0.6rem;
      }

      .logo {
        font-size: clamp(0.7rem, 3vw, 1rem);
      }

      .poster-section {
        min-height: clamp(58vh, 72vh, 88vh);
      }

      .poster-image {
        min-height: clamp(58vh, 72vh, 88vh);
      }

      .gradient-overlay {
        height: clamp(50%, 65%, 80%);
        background: linear-gradient(
          to top,
          #0b0d0f 0%,
          #0b0d0f 15%,
          rgba(11, 13, 15, 0.9) 30%,
          rgba(11, 13, 15, 0.6) 50%,
          rgba(11, 13, 15, 0.3) 70%,
          transparent 100%
        );
      }
    }

    /* ----- TABLET: PORTRAIT ----- */
    @media (orientation: portrait) and (min-width: 769px) and (max-width: 1024px) {
      .poster-section {
        min-height: clamp(48vh, 58vh, 68vh);
      }

      .poster-image {
        min-height: clamp(48vh, 58vh, 68vh);
        object-fit: cover;
      }

      .gradient-overlay {
        height: clamp(35%, 50%, 65%);
      }
    }

    /* ----- LANDSCAPE: Tablets & Desktops ----- */
    @media (orientation: landscape) and (min-width: 769px) {
      .poster-section {
        min-height: clamp(42vh, 55vh, 68vh);
      }

      .poster-image {
        min-height: clamp(42vh, 55vh, 68vh);
        object-fit: cover;
        width: 100%;
      }

      .gradient-overlay {
        height: clamp(30%, 45%, 60%);
        background: linear-gradient(
          to top,
          #0b0d0f 0%,
          #0b0d0f 10%,
          rgba(11, 13, 15, 0.8) 25%,
          rgba(11, 13, 15, 0.4) 45%,
          rgba(11, 13, 15, 0.15) 65%,
          transparent 100%
        );
      }
    }

    /* ----- DESKTOP: Standard ----- */
    @media (min-width: 1025px) {
      .poster-section {
        min-height: clamp(45vh, 58vh, 72vh);
      }

      .poster-image {
        min-height: clamp(45vh, 58vh, 72vh);
        object-fit: cover;
        width: 100%;
      }

      .gradient-overlay {
        height: clamp(30%, 45%, 60%);
        background: linear-gradient(
          to top,
          #0b0d0f 0%,
          #0b0d0f 8%,
          rgba(11, 13, 15, 0.75) 22%,
          rgba(11, 13, 15, 0.35) 45%,
          rgba(11, 13, 15, 0.1) 70%,
          transparent 100%
        );
      }
    }

    /* ----- LARGE DESKTOP: 1920px+ ----- */
    @media (min-width: 1920px) {
      .poster-section {
        min-height: clamp(48vh, 60vh, 75vh);
      }

      .poster-image {
        min-height: clamp(48vh, 60vh, 75vh);
      }

      .gradient-overlay {
        height: clamp(28%, 42%, 55%);
      }
    }

    /* ----- ULTRA-WIDE (21:9) ----- */
    @media (min-aspect-ratio: 21/9) {
      .poster-section {
        min-height: clamp(38vh, 48vh, 58vh);
      }

      .poster-image {
        min-height: clamp(38vh, 48vh, 58vh);
        object-fit: cover;
      }

      .gradient-overlay {
        height: clamp(25%, 40%, 50%);
        background: linear-gradient(
          to top,
          #0b0d0f 0%,
          #0b0d0f 10%,
          rgba(11, 13, 15, 0.7) 25%,
          rgba(11, 13, 15, 0.3) 50%,
          transparent 100%
        );
      }
    }

    /* ----- TALL SCREENS (foldables) ----- */
    @media (max-aspect-ratio: 9/16) {
      .poster-section {
        min-height: clamp(60vh, 75vh, 90vh);
      }

      .poster-image {
        min-height: clamp(60vh, 75vh, 90vh);
        object-fit: cover;
      }

      .gradient-overlay {
        height: clamp(50%, 65%, 80%);
        background: linear-gradient(
          to top,
          #0b0d0f 0%,
          #0b0d0f 18%,
          rgba(11, 13, 15, 0.9) 35%,
          rgba(11, 13, 15, 0.6) 55%,
          rgba(11, 13, 15, 0.3) 75%,
          transparent 100%
        );
      }
    }

    /* ---------- RESPONSIVE CLOUDS ---------- */
    @media (max-width: 1024px) {
      .cloud-1 {
        width: min(85vw, 600px);
        height: min(45vh, 350px);
      }
    }

    @media (max-width: 768px) {
      .cloud-1 {
        width: 85vw;
        height: 35vh;
        filter: blur(clamp(25px, 5vw, 40px));
      }

      .cloud-2 {
        width: clamp(120px, 30vw, 180px);
        height: clamp(80px, 20vh, 120px);
        top: clamp(8%, 10vh, 15%);
        left: clamp(3%, 5vw, 8%);
      }

      .cloud-3 {
        width: clamp(140px, 32vw, 200px);
        height: clamp(90px, 22vh, 140px);
        bottom: clamp(8%, 10vh, 15%);
        right: clamp(2%, 4vw, 6%);
      }

      .cloud-4 {
        width: clamp(80px, 18vw, 120px);
        height: clamp(60px, 12vh, 90px);
      }
    }

    @media (max-width: 480px) {
      .cloud-1 {
        width: 90vw;
        height: 30vh;
        filter: blur(20px);
      }

      .cloud-2 {
        width: 100px;
        height: 70px;
        top: 12%;
        left: 5%;
      }

      .cloud-3 {
        width: 120px;
        height: 80px;
        bottom: 12%;
        right: 3%;
      }

      .cloud-4 {
        display: none;
      }
    }

    @media (min-aspect-ratio: 1/1) and (max-height: 800px) {
      .cloud-1 {
        height: 40vh;
        width: 70vw;
      }
    }

    @media (min-width: 1920px) {
      .cloud-1 {
        width: 700px;
        height: 450px;
      }
      
      .cloud-2 {
        width: 400px;
        height: 280px;
      }
      
      .cloud-3 {
        width: 450px;
        height: 300px;
      }
    }

    /* ---------- REDUCED MOTION ---------- */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-primary: #0b0d0f;
      }
    }
  </style>
</head>
<body>

  <!-- ====== HEADER - FULLY TRANSPARENT ====== -->
  <header>
    <a href="#" class="logo" aria-label="matchdekho home">
      <span class="match">match</span><span class="dekho">dekho</span>
    </a>
  </header>

  <!-- ====== POSTER SECTION - TOUCHES TOP ====== -->
  <div class="poster-wrapper">
    <section class="poster-section">
      <picture>
        <!-- Mobile/Portrait Poster -->
        <source 
          media="(orientation: portrait) and (max-width: 768px)" 
          srcset="https://img.tod.tv/resources/images/link/da4d217b-ebff-3a16-b471-d8287b9c11e2/8c0c7840-d932-5be7-abf7-2d7d3b1fb6b9/639191042450000000/0:20:720:960/1125x1500/f2b58287-d82d-4afd-a975-eecaeb0b4dea_hero-block-34-en.webp"
        />
        <!-- Tablet/Portrait Poster -->
        <source 
          media="(orientation: portrait) and (max-width: 1024px)" 
          srcset="https://img.tod.tv/resources/images/link/da4d217b-ebff-3a16-b471-d8287b9c11e2/8c0c7840-d932-5be7-abf7-2d7d3b1fb6b9/639191042450000000/0:20:720:960/1125x1500/f2b58287-d82d-4afd-a975-eecaeb0b4dea_hero-block-34-en.webp"
        />
        <!-- Desktop/Landscape Poster -->
        <source 
          media="(orientation: landscape) and (min-width: 769px)" 
          srcset="https://img.tod.tv/resources/images/link/92b34ae9-13ba-3791-807f-d2b034bdfac9/6060b852-c1ae-5aac-985e-64478041ec5e/639191043340000000/0:0:1912:1080/1600x900/4d8deba7-d76e-4880-8cd8-a8ede006ea47_wallpaper-169-en.webp"
        />
        <!-- Large Desktop Poster -->
        <source 
          media="(min-width: 1025px)" 
          srcset="https://img.tod.tv/resources/images/link/92b34ae9-13ba-3791-807f-d2b034bdfac9/6060b852-c1ae-5aac-985e-64478041ec5e/639191043340000000/0:0:1912:1080/1600x900/4d8deba7-d76e-4880-8cd8-a8ede006ea47_wallpaper-169-en.webp"
        />
        <!-- Fallback -->
        <img 
          src="https://img.tod.tv/resources/images/link/92b34ae9-13ba-3791-807f-d2b034bdfac9/6060b852-c1ae-5aac-985e-64478041ec5e/639191043340000000/0:0:1912:1080/1600x900/4d8deba7-d76e-4880-8cd8-a8ede006ea47_wallpaper-169-en.webp" 
          alt="matchdekho poster"
          class="poster-image"
          loading="lazy"
        />
      </picture>
      
      <!-- ====== BLACK GRADIENT OVERLAY (OTT STYLE) ====== -->
      <div class="gradient-overlay"></div>
    </section>
  </div>

  <!-- ====== GLASS CLOUDS ====== -->
  <div class="glass-cloud cloud-1" aria-hidden="true"></div>
  <div class="glass-cloud cloud-2" aria-hidden="true"></div>
  <div class="glass-cloud cloud-3" aria-hidden="true"></div>
  <div class="glass-cloud cloud-4" aria-hidden="true"></div>

  <!-- ====== MAIN CONTENT ====== -->
  <main role="main">
    <!-- Your content goes here -->
  </main>

</body>
</html>
