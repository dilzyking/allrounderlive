<style>
@font-face{font-family:"Outfit";font-style:normal;font-weight:100 900;font-display:swap;src:url("https://allrounderlive.com/font.woff2") format("woff2")}
:root{--font:"Outfit","Inter","Segoe UI",system-ui,sans-serif;--bg:#08090d;--out:cubic-bezier(.22,1,.36,1);--hh:62px;--accent:#ff6412}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html.lock{overflow:hidden}
html,body,button,input,a{font-family:var(--font);font-synthesis:none;text-rendering:optimizeLegibility}
body{margin:0;min-height:100vh;color:#eee;background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a,button{-webkit-tap-highlight-color:transparent}
a{color:inherit}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible{outline:2px solid #f55505;outline-offset:2px}

/* Header */
.site-header{position:sticky;top:0;z-index:30;height:var(--hh);display:flex;align-items:center;gap:20px;padding:0 20px;background:linear-gradient(180deg,#131d2b 0%,#101723 28%,#0c111a 60%,#08090d 100%);border-bottom:1px solid rgba(255,255,255,.07)}
.menu{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;width:34px;height:34px;padding:0;flex:0 0 34px;background:none;border:0;color:#fff}
.menu i{display:block;height:3px;width:26px;border-radius:3px;background:currentColor}
.menu i:nth-child(2){width:16px}
.brand{display:flex;align-items:center;min-width:0;text-decoration:none}
.brand img{display:block;height:48px;width:auto;max-width:min(240px,38vw);object-fit:contain}
.offers{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0;border:1px solid #ffffff40;border-radius:22px;background:#ffffff1f;padding:7px 11px;font-size:12px;color:#f3e8cb}
.offers svg{width:17px;height:17px}
.desktop-nav,.profile{display:none}

/* Player */
main{min-height:calc(100dvh - var(--hh));background:var(--bg)}
.player-wrapper{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.player-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}
@media(min-width:900px){.player-wrapper{height:min(56.25vw,70vh);aspect-ratio:auto}}

/* Promo poster: lives in an isolated frame (see script) */
.promo-frame{display:block;width:calc(92% + 28px);height:250px;margin:0 calc(4% - 14px);border:0;background:transparent}

/* Tabs */
.streams-shell{padding:14px 4% 58px;max-width:1660px;margin:0 auto}
.tabs{position:sticky;top:var(--hh);z-index:15;display:flex;width:100%;min-height:56px;background:#0c0f15;border:1px solid #202631;border-bottom-color:#303744;border-radius:5px 5px 0 0;overflow:hidden}
.tab-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;flex:1;min-width:0;min-height:56px;padding:12px 18px;border:0;background:none;color:#8d94a2;font-size:14px;font-weight:750;transition:color .2s,background .2s}
.tab-btn+.tab-btn{border-left:1px solid #1d2330}
.tab-btn span{white-space:nowrap}
.tab-btn svg{width:20px;height:20px;flex:0 0 20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab-btn:hover{background:#151a24;color:#fff}
.tab-btn.active{color:#f8f9fb;background:linear-gradient(180deg,#1b202a,#10151d)}
.tab-btn.active svg{color:var(--accent)}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:16%;right:16%;height:3px;background:var(--accent);border-radius:4px 4px 0 0}
.tab-count{display:inline-grid;place-items:center;min-width:22px;height:19px;padding:0 4px;font-size:10px;font-weight:850;color:#b8becb;background:#2a303b;border-radius:4px}
.tab-content{display:none;width:100%;background:var(--bg)}
.tab-content.active{display:block}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:10px 0 8px}
.section-heading h2{display:flex;align-items:center;gap:9px;margin:0;font-size:clamp(19px,2vw,26px);color:#eaecf0;font-weight:700;line-height:1.15;letter-spacing:-.5px}
.section-heading h2 svg{width:18px;height:18px;stroke:#e7e9ed;stroke-width:2.4;fill:none}
.section-heading p{margin:7px 0 0;color:#9096a4;font-size:12px}
.stream-count{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:#aab0bb;font-size:11px;font-weight:700;padding-bottom:4px}
.stream-count i{width:7px;height:7px;background:#f34b57;border-radius:50%}

/* Channel cards */
.channels-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.35vw,18px);align-content:start;width:100%}
.channel-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;width:100%;min-width:0;min-height:158px;padding:20px 12px 18px;text-align:center;border:1px solid #252c38;border-radius:9px;background:linear-gradient(155deg,#19202c 0%,#111721 65%,#10141e 100%);color:#f7f8fb;box-shadow:0 6px 16px rgba(0,0,0,.13);transition:border-color .23s,transform .3s var(--out)}
.channel-card:hover{border-color:#596578;transform:translateY(-3px)}
.channel-card:active{transform:scale(.986)}
.channel-card.active{border-color:#ff681c;box-shadow:0 0 0 1px rgba(255,104,28,.35);background:linear-gradient(155deg,#27212a 0%,#171b25 65%,#11151f 100%)}
.channel-logo{display:grid;place-items:center;flex:0 0 auto;width:65px;height:65px;border:2px solid rgba(130,173,218,.32);border-radius:50%;background:radial-gradient(circle at 30% 20%,#273b54,#0d1421 78%);color:#e8f1ff;font-size:18px;font-weight:850;letter-spacing:-.5px;box-shadow:inset 0 1px 5px rgba(255,255,255,.07),0 7px 18px rgba(0,0,0,.3)}
.channel-card.active .channel-logo{border-color:#ff8c4a;color:#fff3e6}
.channel-name{display:block;max-width:100%;font-size:clamp(13px,1.1vw,16px);font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-container{width:100%;min-height:70vh;overflow:hidden;border:1px solid #252d39;border-radius:6px;background:#101620}
.chat-container iframe{display:block;width:100%;height:70vh;border:0}

/* WhatsApp channel popup */
#waOverlay{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto;background:rgba(1,3,8,.85);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px)}
#waOverlay.show{display:flex;animation:fade .22s ease both}
#waCard{position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden;width:100%;max-width:340px;padding:36px 24px 24px;border-radius:16px;background:linear-gradient(145deg,#1b2430 0%,#111620 47%,#0d1119 100%);border:1px solid #354151;box-shadow:0 35px 105px rgba(0,0,0,.75);color:#f5f6f9;text-align:center}
#waCard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff6412,#ef9d37 30%,#28d369 75%,#128c7e)}
#waOverlay.show #waCard{animation:pop .42s cubic-bezier(.18,1,.32,1) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.popup-close{position:absolute;top:13px;right:13px;display:grid;place-items:center;width:30px;height:30px;border:1px solid #364050;background:rgba(255,255,255,.045);border-radius:50%;color:#a9b1bf}
.popup-close:hover{color:#fff;background:#2a3443}
.popup-close svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.popup-icon{display:grid;place-items:center;width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,#44e889,#179a51);box-shadow:0 12px 28px rgba(3,13,8,.55),0 0 40px rgba(37,211,102,.18)}
.popup-icon svg{width:36px;height:36px;fill:#fff}
#waCard h2{margin:18px 0 22px;font-size:clamp(19px,5vw,22px);line-height:1.25;letter-spacing:-.4px;font-weight:800}
.waBtns{display:flex;flex-direction:column;gap:9px;width:100%}
.waBtn{display:inline-flex;justify-content:center;align-items:center;width:100%;min-height:46px;border-radius:6px;font-weight:800;font-size:13px;transition:transform .2s,background .2s}
.waBtn:active{transform:scale(.985)}
#joinNow{order:-1;background:#25d366;color:#081910;border:1px solid #25d366}
#joinNow:hover{background:#4de189}
#joinedBtn{border:1px solid #364251;color:#d1d7e1;background:#202835}
#joinedBtn:hover{background:#2a3544}

/* Mobile menu */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s linear .3s}
.scrim.open{opacity:1;visibility:visible;transition:opacity .3s}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:50;display:flex;flex-direction:column;width:min(86vw,340px);background:linear-gradient(180deg,#13151c,#0b0d12 45%);border-right:1px solid #ffffff12;box-shadow:24px 0 60px -20px #000c;transform:translateX(-104%);visibility:hidden;transition:transform .3s var(--out),visibility 0s linear .3s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .4s var(--out)}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px 20px}
.dr-head img{display:block;height:44px;width:auto;max-width:220px;object-fit:contain}
.dclose{width:42px;height:42px;border:0;border-radius:50%;background:#ffffff10;color:#fff;font-size:24px;line-height:1}
.dr-nav{flex:1;overflow-y:auto;padding:8px 10px}
.dr-item{display:flex;align-items:center;min-height:50px;margin:2px 0;padding:0 14px;border-radius:10px;color:#dfe1e7;font-size:15px;font-weight:500;text-decoration:none}
.dr-item:hover{background:#ffffff0a}
.dr-item.cur{color:#fff;background:linear-gradient(90deg,#f5550528,transparent);box-shadow:inset 3px 0 #f55505}
.dr-foot{padding:12px 16px 16px;border-top:1px solid #ffffff12}
.dr-login{display:flex;align-items:center;justify-content:center;height:46px;border-radius:3px;background:#f55505;color:#fff;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;text-decoration:none}

/* Responsive */
@media(max-width:600px){

.tabs,.tab-btn{min-height:49px}

.tab-btn svg{width:18px;height:18px;flex-basis:18px}
.section-heading h2{font-size:19px}
.channels-grid{gap:10px}
.channel-card{min-height:140px;padding:17px 8px 15px;gap:12px}
.channel-logo{width:55px;height:55px;font-size:15px}
.channel-name{font-size:12px}
}
@media(max-width:360px){.channel-logo{width:49px;height:49px;font-size:13px}}

@media(min-width:768px){

.menu,.drawer,.scrim{display:none!important}

.brand img{height:clamp(36px,2.6vw,48px);max-width:260px}

.desktop-nav a:first-child::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:2px;background:#ff5900}
.desktop-nav svg{width:11px;height:11px}

.profile{display:flex;align-items:center;justify-content:center;border:0;background:none;color:#fff;padding:0;margin-left:-6px}
.profile svg{width:clamp(28px,1.7vw,34px);height:clamp(28px,1.7vw,34px)}
}
@media(min-width:1050px){.channels-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1500px){.channels-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(orientation:landscape) and (max-height:500px){#waOverlay{align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Channels + player switching */
const grid=$('#channelsGrid'),player=$('#matchPlayer');
let cur=0;
$('#availableCount').textContent=channels.length+' channels';
$('.tab-count').textContent=channels.length;
const render=()=>{
  grid.innerHTML=channels.map((c,i)=>`<button type="button" class="channel-card${i===cur?' active':''}" data-index="${i}" aria-pressed="${i===cur}" aria-label="${esc(c.name)} channel${i===cur?', currently selected':''}"><span class="channel-logo" aria-hidden="true">${esc(c.logo)}</span><span class="channel-name">${esc(c.name)}</span></button>`).join('');
};
grid.addEventListener('click',e=>{
  const b=e.target.closest('.channel-card');
  if(!b)return;
  const i=Number(b.dataset.index);
  if(i===cur||!channels[i])return;
  cur=i;player.src=channels[i].url;render();
  if(e.detail===0)grid.querySelector(`[data-index="${i}"]`).focus({preventScroll:true});
});
render();

/* Channels / Live Chat tabs */
const tabs=[...document.querySelectorAll('.tab-btn')],panels=[...document.querySelectorAll('.tab-content')];
tabs.forEach(b=>b.addEventListener('click',()=>{
  tabs.forEach(t=>{const on=t===b;t.classList.toggle('active',on);t.setAttribute('aria-selected',String(on))});
  panels.forEach(p=>{const on=p.id===b.dataset.tab;p.classList.toggle('active',on);p.hidden=!on});
}));

/* WhatsApp channel popup */
const ov=$('#waOverlay'),pc=$('#popupCloseBtn');
let prevFocus=null;
const hide=()=>{
  if(!ov.classList.contains('show'))return;
  ov.classList.remove('show');
  if(prevFocus&&prevFocus.focus)prevFocus.focus({preventScroll:true});
};
setTimeout(()=>{prevFocus=document.activeElement;ov.classList.add('show');pc.focus({preventScroll:true})},3000);
pc.addEventListener('click',hide);
$('#joinedBtn').addEventListener('click',hide);
$('#joinNow').addEventListener('click',()=>{window.open(WA_CHANNEL,'_blank','noopener,noreferrer');hide()});
ov.addEventListener('click',e=>{if(e.target===ov)hide()});
document.addEventListener('keydown',e=>{
  if(!ov.classList.contains('show'))return;
  if(e.key==='Escape'){hide();return}
  if(e.key!=='Tab')return;
  const it=[...ov.querySelectorAll('button')],f=it[0],l=it[it.length-1];
  if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}
  else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}
});

/* Mobile menu */
const drawer=$('#drawer'),scrim=$('#scrim'),menuBtn=$('.menu'),mq=matchMedia('(min-width:768px)');
let dOpen=false,lastFocus=null;
const setDrawer=open=>{
  if(open===dOpen||(open&&mq.matches))return;
  dOpen=open;
  if(open)lastFocus=document.activeElement;
  drawer.inert=!open;
  drawer.setAttribute('aria-hidden',String(!open));
  menuBtn.setAttribute('aria-expanded',String(open));
  document.documentElement.classList.toggle('lock',open);
  drawer.classList.toggle('open',open);
  scrim.classList.toggle('open',open);
  if(open)setTimeout(()=>$('.dclose').focus({preventScroll:true}),60);
  else if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
};
menuBtn.addEventListener('click',()=>setDrawer(true));
$('.dclose').addEventListener('click',()=>setDrawer(false));
scrim.addEventListener('click',()=>setDrawer(false));
window.addEventListener('keydown',e=>{if(e.key==='Escape')setDrawer(false)});
mq.addEventListener('change',()=>{if(mq.matches)setDrawer(false)});
drawer.addEventListener('click',e=>{if(e.target.closest('a[href]'))setDrawer(false)});

/* Poster area is rendered inside an isolated frame, so the page's ad script never sees taps inside it */
const frame=$('#promoFrame');
frame.srcdoc='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>'+$('#promoDoc').innerHTML.replace('{{WA_CHAT}}',WHATSAPP_CHAT)+'</body></html>';
let promoLock=0;
window.addEventListener('message',e=>{
  const d=e.data;
  if(e.source!==frame.contentWindow||!d||!d.promo)return;
  if(d.promo==='h'&&d.v>0)frame.style.height=d.v+'px';
  else if(d.promo==='tap')promoLock=Date.now()+1500;
  else if(d.promo==='click'&&typeof gtag==='function')gtag('event','promo_click',{link_url:String(d.href||'')});
});

/* Popunder limiter: only one extra window while the popup is open */
const originalOpen=window.open;
let popupAds=0;
window.open=function(...args){
  if(Date.now()<promoLock)return null;
  if(ov.classList.contains('show')&&String(args[0]||'')!==WA_CHANNEL){
    if(popupAds>=1)return null;
    popupAds++;
  }
  return originalOpen.apply(window,args);
};
})();
</script>
