<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>France vs Spain Highlights</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#050505;
    color:#fff;
}

header{
    background:linear-gradient(90deg,#0033a0,#000,#aa151b);
    padding:18px;
    text-align:center;
    font-size:26px;
    font-weight:bold;
    letter-spacing:1px;
}

.player{
    width:100%;
    max-width:1400px;
    margin:20px auto;
    aspect-ratio:16/9;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 30px rgba(255,255,255,.15);
}

.player iframe{
    width:100%;
    height:100%;
    border:0;
}

.info{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.match{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:30px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.team{
    text-align:center;
}

.flag{
    font-size:70px;
}

.team h2{
    margin-top:10px;
    font-size:28px;
}

.vs{
    font-size:40px;
    font-weight:bold;
    color:#ffcc00;
}

.desc{
    background:#111;
    border-radius:12px;
    padding:20px;
    line-height:1.8;
    color:#ddd;
}

button{
    display:block;
    margin:30px auto;
    background:#ff0000;
    color:#fff;
    border:none;
    padding:15px 35px;
    font-size:18px;
    border-radius:50px;
    cursor:pointer;
}

button:hover{
    background:#d40000;
}
</style>
</head>

<body>

<header>
🇫🇷 France vs Spain 🇪🇸 Highlights
</header>

<div class="player">
    <!-- Replace VIDEO_ID with your YouTube video ID -->
    <iframe
        src="https://www.youtube.com/embed/VIDEO_ID?rel=0&autoplay=1"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>
</div>

<div class="info">

<div class="match">

<div class="team">
<div class="flag">🇫🇷</div>
<h2>France</h2>
</div>

<div class="vs">VS</div>

<div class="team">
<div class="flag">🇪🇸</div>
<h2>Spain</h2>
</div>

</div>

<div class="desc">
<h2>Match Highlights</h2>
<br>
<p>
Watch the complete highlights of the exciting France vs Spain football match.
Relive every goal, assist, tackle, save and the best moments from this thrilling encounter in HD quality.
</p>
</div>

<button onclick="location.reload()">
▶ Watch Again
</button>

</div>

</body>
</html>
