<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>France vs Spain Highlights</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
color:#fff;
}

header{
background:linear-gradient(90deg,#0047ab,#111,#c60b1e);
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:1400px;
margin:20px auto;
padding:15px;
}

.video-wrap{
aspect-ratio:16/9;
background:#111;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 25px rgba(255,255,255,.15);
}

video{
width:100%;
height:100%;
}

.info{
margin-top:25px;
background:#111;
padding:20px;
border-radius:12px;
line-height:1.7;
}

h2{
margin-bottom:10px;
}
</style>
</head>

<body>

<header>
 India vs Zimbabwe Highlights 
</header>

<div class="container">

<div class="video-wrap">
<video id="player" playsinline controls></video>
</div>

<div class="info">
<h2>Highlights</h2>
<p>
Watch the complete France vs Spain FIFA World Cup highlights in HD.
</p>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
const source =
"https://in-mc-vod.fancode.com/vision/skillup-uploads/cms-media/1784867380/V2-IND-vs-ZIM-1stT20I-English-Highlights-Final/index.m3u8";

const video = document.getElementById("player");

if(Hls.isSupported()){

const hls = new Hls();

hls.loadSource(source);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){

const qualities = hls.levels.map(level=>level.height);

new Plyr(video,{
quality:{
default:qualities[0],
options:qualities,
forced:true,
onChange:(quality)=>{
hls.levels.forEach((level,index)=>{
if(level.height===quality){
hls.currentLevel=index;
}
});
}
}
});

});

}else if(video.canPlayType('application/vnd.apple.mpegurl')){

video.src=source;
new Plyr(video);

}
</script>

</body>
</html>
