<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CREX – Cricket Scores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2128;
  --bg4: #21262d;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #484f58;
  --live: #f85149;
  --live-bg: rgba(248,81,73,0.12);
  --green: #3fb950;
  --green-bg: rgba(63,185,80,0.12);
  --blue: #58a6ff;
  --blue-bg: rgba(88,166,255,0.12);
  --gold: #e3b341;
  --gold-bg: rgba(227,179,65,0.12);
  --orange: #f0883e;
  --accent: #58a6ff;
  --radius: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* ── TOP NAV (CREX-style) ── */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}
.logo {
  display: flex; align-items: center; gap: 8px;
}
.logo-icon {
  width: 32px; height: 32px;
  background: #fff;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon img { width: 22px; height: 22px; object-fit: contain; }
.logo-text {
  font-size: 20px; font-weight: 700; letter-spacing: 1px;
  color: var(--text);
}
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2);
}
.avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e03131, #c92a2a);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff;
  cursor: pointer;
}

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 0;
  padding: 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0;
  padding: 12px 20px;
  font-size: 13px; font-weight: 500;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  position: relative;
}
.tab.active {
  color: var(--text);
  border-bottom-color: #e03131;
}
.tab-count {
  font-size: 10px;
  color: var(--text3);
  margin-left: 4px;
}
.tab.active .tab-count { color: var(--text2); }

/* ── MAIN ── */
.main { padding: 0 0 100px; }

/* ── SERIES GROUP ── */
.series-group { margin-top: 0; }
.series-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.series-header:first-child { border-top: none; }
.series-left { display: flex; align-items: center; gap: 8px; }
.series-icon {
  width: 26px; height: 26px; border-radius: 6px;
  overflow: hidden; flex-shrink: 0;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
}
.series-icon img { width: 100%; height: 100%; object-fit: cover; }
.series-name { font-size: 12px; font-weight: 600; color: var(--text); }
.series-chevron {
  font-size: 12px; color: var(--text3);
  transition: transform 0.2s;
}
.series-chevron.open { transform: rotate(180deg); }

/* ── MATCH CARD ── */
.match-card {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
  cursor: pointer;
  transition: background 0.1s;
  animation: fadeIn 0.3s ease;
}
.match-card:active { background: var(--bg2); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.card-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.match-meta { font-size: 10px; color: var(--text3); }
.status-pill {
  font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 10px;
  letter-spacing: 0.3px;
}
.pill-live { background: var(--live-bg); color: var(--live); }
.pill-inplay { background: var(--green-bg); color: var(--green); }
.pill-upcoming { background: var(--blue-bg); color: var(--blue); }
.pill-completed { background: rgba(255,255,255,0.05); color: var(--text3); }
.pill-stumps { background: var(--gold-bg); color: var(--gold); }

/* Teams section */
.teams { display: flex; flex-direction: column; gap: 0; }

.team-row {
  display: flex; align-items: center;
  padding: 5px 0;
}
.team-flag-wrap {
  width: 28px; height: 28px;
  border-radius: 6px; overflow: hidden;
  flex-shrink: 0;
  background: var(--bg3);
  display: flex; align-items: center; justify-content: center;
  margin-right: 10px;
  border: 1px solid var(--border);
}
.team-flag-wrap img { width: 100%; height: 100%; object-fit: cover; }
.flag-txt { font-size: 8px; font-weight: 700; color: var(--text3); }

.team-name-col { flex: 1; min-width: 0; }
.team-name {
  font-size: 14px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.team-row.dim .team-name { color: var(--text2); font-weight: 400; }
.team-row.batting .team-name { color: #fff; }

.score-col { text-align: right; min-width: 80px; }
.score-main {
  font-size: 15px; font-weight: 700; color: var(--text);
  font-variant-numeric: tabular-nums;
}
.team-row.batting .score-main { color: var(--gold); }
.score-overs { font-size: 10px; color: var(--text3); }
.score-none { font-size: 13px; color: var(--text3); }

/* Batting dot */
.bat-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold);
  margin-left: 5px;
  display: inline-block; vertical-align: middle;
  flex-shrink: 0;
}

.team-divider { height: 1px; background: var(--border); margin: 1px 0; }

/* Status line */
.status-line {
  margin-top: 8px;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 11px;
  color: var(--text2);
  background: var(--bg2);
  line-height: 1.4;
}
.status-line.result { color: var(--green); background: var(--green-bg); }
.status-line.stumps-line { color: var(--gold); background: var(--gold-bg); }
.status-line.upcoming-time { color: var(--blue); background: var(--bg2); }

/* Win probability */
.win-prob {
  display: flex; align-items: center; gap: 8px;
  margin-top: 8px;
  font-size: 10px; color: var(--text3);
}
.prob-bar {
  flex: 1; height: 4px; border-radius: 2px;
  background: var(--bg3); overflow: hidden;
}
.prob-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--blue);
  transition: width 0.6s ease;
}
.prob-val { font-size: 11px; font-weight: 600; color: var(--blue); }

/* Odds footer */
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.odds-wrap { display: flex; align-items: center; gap: 10px; }
.odds-item { display: flex; align-items: center; gap: 4px; }
.odds-lbl { font-size: 10px; color: var(--text3); }
.odds-val { font-size: 11px; font-weight: 600; }
.odds-back { color: var(--green); }
.odds-lay { color: var(--live); }

.tags { display: flex; align-items: center; gap: 5px; }
.tag {
  font-size: 9px; font-weight: 600; padding: 2px 6px;
  border-radius: 4px; letter-spacing: 0.3px;
}
.tag-dls { background: var(--blue-bg); color: var(--blue); }
.tag-so { background: var(--gold-bg); color: var(--gold); }
.tag-tv { font-size: 12px; }

/* ── LOADER ── */
#loader {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 0; gap: 16px;
}
.ball-loader {
  width: 44px; height: 44px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #ff6b6b, #c0392b);
  position: relative;
  animation: spin 0.9s linear infinite;
}
.ball-loader::before, .ball-loader::after {
  content: ''; position: absolute;
  border: 2px solid rgba(255,255,255,0.25);
  border-radius: 50%;
}
.ball-loader::before { top:4px;left:4px;right:4px;bottom:18px; }
.ball-loader::after { top:18px;left:4px;right:4px;bottom:4px; }
@keyframes spin { to { transform: rotate(360deg); } }
#loader p { color: var(--text3); font-size: 12px; }

/* ── ERROR ── */
#error-box { display: none; text-align: center; padding: 60px 20px; }
#error-box h3 { color: var(--live); font-size: 16px; margin-bottom: 8px; }
#error-box p { color: var(--text3); font-size: 12px; margin-bottom: 20px; }
#error-box button {
  background: var(--live-bg); color: var(--live);
  border: 1px solid var(--live); border-radius: 8px;
  padding: 8px 20px; font-size: 13px; cursor: pointer;
  font-family: inherit;
}

/* ── NO MATCHES ── */
.no-matches {
  text-align: center; padding: 50px 20px;
  color: var(--text3); font-size: 13px;
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  z-index: 100;
}
.bot-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 10px 4px;
  cursor: pointer; color: var(--text3);
  font-size: 10px; gap: 4px;
  transition: color 0.15s;
}
.bot-item.active { color: var(--text); }
.bot-icon { font-size: 20px; }
.bot-item.active .bot-icon-ball { 
  filter: brightness(1.4);
}
.new-badge {
  position: absolute;
  top: 4px; right: 50%;
  transform: translateX(10px);
  background: var(--live);
  color: #fff; font-size: 7px; font-weight: 700;
  padding: 1px 4px; border-radius: 3px;
}

/* ── REFRESH FAB ── */
#refresh-indicator {
  position: fixed; top: 70px; right: 16px;
  font-size: 10px; color: var(--text3);
  z-index: 50;
}

/* ── RESPONSIVE ── */
@media (min-width: 600px) {
  .main { max-width: 480px; margin: 0 auto; }
  .top-nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
  .bottom-nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-nav">
  <div class="nav-inner">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <circle cx="12" cy="12" r="10" fill="#d63031"/>
          <path d="M7 10c1-3 6-5 10-3M17 14c-1 3-6 5-10 3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">CREX</span>
    </div>
    <div class="nav-right">
      <div class="nav-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <div class="avatar">P</div>
    </div>
  </div>
  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="setTab('foryou')">For you</div>
    <div class="tab" id="tab-live" onclick="setTab('live')">Live <span class="tab-count" id="tc-live">(0)</span></div>
    <div class="tab" onclick="setTab('upcoming')">Upcoming</div>
    <div class="tab" onclick="setTab('finished')">Finished</div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main-content">
  <div id="loader">
    <div class="ball-loader"></div>
    <p>Fetching live scores…</p>
  </div>
  <div id="error-box">
    <h3>⚠ Unable to Load</h3>
    <p id="error-msg">Could not fetch match data.</p>
    <button onclick="loadAll()">Try Again</button>
  </div>
  <div id="matches-container" style="display:none"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="bot-item active">
    <div class="bot-icon">🏠</div>
    <span>Home</span>
  </div>
  <div class="bot-item">
    <div class="bot-icon">🏆</div>
    <span>Series</span>
  </div>
  <div class="bot-item active">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" fill="#d63031"/>
      <path d="M7 10c1-3 6-5 10-3M17 14c-1 3-6 5-10 3" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <span style="color:var(--text)">Matches</span>
  </div>
  <div class="bot-item" style="position:relative">
    <div class="bot-icon">👥</div>
    <div class="new-badge">NEW</div>
    <span>Social</span>
  </div>
  <div class="bot-item">
    <div class="bot-icon">▶️</div>
    <span>Videos</span>
  </div>
</div>

<script>
const MATCHES_API = 'https://api-v1.com/w/liveMatches2.php';
const TEAMS_API   = 'https://crex-api-dillzy.sayanwork-studioo.workers.dev/teams';

let allData    = {};
let teamsMap   = {};
let activeTab  = 'foryou';
let openGroups = {};

/* ── Load teams once ── */
async function loadTeams() {
  try {
    const r = await fetch(TEAMS_API);
    teamsMap = await r.json();
  } catch(e) { teamsMap = {}; }
}

/* ── Get team flag URL from teamsMap by code ── */
function getTeamFlag(code) {
  if (!code) return null;
  const t = teamsMap[code];
  return t ? t.flag : null;
}

/* ── Team full name ── */
function getTeamName(code) {
  if (!code) return code;
  const t = teamsMap[code];
  return t ? t.name : code;
}

/* ── Flag img HTML ── */
function flagHtml(code) {
  const url = getTeamFlag(code);
  const disp = (code || '??').toString().slice(0,3).toUpperCase();
  if (url) {
    return `<div class="team-flag-wrap"><img src="${url}" alt="${disp}" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=flag-txt>${disp}</span>'"></div>`;
  }
  return `<div class="team-flag-wrap"><span class="flag-txt">${disp}</span></div>`;
}

/* ── Status ── */
function getStatus(d, ifs) {
  if (d === 2) return 'completed';
  if (d === 1) {
    if (ifs === 'C' || ifs === 'S') return 'inplay';
    return 'upcoming';
  }
  if (d === 4 || d === 6) return 'inplay';
  if (ifs === 'C') return 'inplay';
  if (ifs === 'NS') return 'upcoming';
  return 'live';
}

function cleanScore(s) { return s ? s.replace(/^!/, '') : ''; }

function splitScore(s) {
  if (!s) return { runs: '', overs: '' };
  const m = s.match(/^([\d\/\-]+)\(([^)]+)\)/);
  if (m) return { runs: m[1], overs: '(' + m[2] + ')' };
  return { runs: s, overs: '' };
}

function parseOdds(flb) {
  if (!flb) return null;
  const p = flb.split('|');
  if (p.length < 3) return null;
  const back = parseFloat(p[1]), lay = parseFloat(p[2]);
  if (!back && !lay) return null;
  return { back, lay };
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  const now = new Date();
  const diffH = (d - now) / 3600000;
  if (diffH > 0 && diffH < 20) {
    return 'Tomorrow ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

/* ── Build one match card ── */
function buildCard(id, m) {
  const status = getStatus(m.d, m.ifs);

  const homeCode = m.b || 'HME';
  const awayCode = m.c || 'AWY';

  const homeS1 = cleanScore(m.j || '');
  const homeS2 = cleanScore(m.l || '');
  const awayS1 = cleanScore(m.k || '');
  const awayS2 = cleanScore(m.m || '');

  const homeIsBat = m.i === 0 || m.i === '0';
  const awayIsBat = m.i === 1 || m.i === '1';

  const odds = parseOdds(m.flb);
  const hasDLS = m.ac && m.ac.toLowerCase().includes('dls');
  const hasSO  = m.r || (m.res && m.res.toLowerCase().includes('super'));
  const hasTV  = m.v && m.v !== 'AX' && m.v !== '0';

  /* Status pill */
  let pillHtml = '';
  if (status === 'inplay') {
    const isStumps = m.s && m.s.toLowerCase().includes('stump');
    if (isStumps) pillHtml = `<span class="status-pill pill-stumps">Stumps</span>`;
    else pillHtml = `<span class="status-pill pill-inplay">▶ In Play</span>`;
  } else if (status === 'completed') {
    pillHtml = `<span class="status-pill pill-completed">Ended</span>`;
  } else if (status === 'upcoming') {
    pillHtml = `<span class="status-pill pill-upcoming">Soon</span>`;
  } else {
    pillHtml = `<span class="status-pill pill-live">● Live</span>`;
  }

  /* Team row helper */
  function teamRow(code, s1, s2, isBat, isDim) {
    const sc1 = splitScore(s1);
    const sc2 = splitScore(s2);
    let scoreHtml = '';
    if (sc1.runs) {
      let runsHtml = sc1.runs;
      if (sc2.runs) runsHtml += ` <span style="font-size:11px;color:var(--text3)">/ ${sc2.runs}</span>`;
      scoreHtml = `<div class="score-col">
        <div class="score-main">${runsHtml}</div>
        <div class="score-overs">${sc1.overs}${sc2.overs ? ' '+sc2.overs : ''}</div>
      </div>`;
    } else {
      scoreHtml = `<div class="score-col"><div class="score-none">—</div></div>`;
    }
    const teamDisplayName = getTeamName(code);
    return `<div class="team-row${isBat?' batting':''}${isDim?' dim':''}">
      ${flagHtml(code)}
      <div class="team-name-col">
        <span class="team-name">${teamDisplayName}${isBat?'<span class="bat-dot"></span>':''}</span>
      </div>
      ${scoreHtml}
    </div>`;
  }

  /* Status line */
  let statusHtml = '';
  if (m.res) {
    statusHtml = `<div class="status-line result">${m.res}${hasDLS?` <span class="tag tag-dls">DLS</span>`:''}</div>`;
  } else if (m.s) {
    const isStumps = m.s.toLowerCase().includes('stump');
    statusHtml = `<div class="status-line${isStumps?' stumps-line':''}">${m.s}</div>`;
  } else if (status === 'upcoming' && m.ti) {
    statusHtml = `<div class="status-line upcoming-time">${fmtTime(m.ti)}</div>`;
  } else if (m.mm) {
    const mmClean = m.mm.replace(/\.\-\^-/g,'').replace(/\./g,' · ').replace(/-/g,'');
    statusHtml = `<div class="status-line">${mmClean}</div>`;
  }

  /* Win probability */
  let probHtml = '';
  if (m.flb) {
    const p = m.flb.split('|');
    if (p.length >= 4 && p[3]) {
      const pct = parseFloat(p[3]);
      if (pct > 0 && pct < 100) {
        probHtml = `<div class="win-prob">
          <span>${(homeCode||'').toString().slice(0,3)}</span>
          <div class="prob-bar"><div class="prob-fill" style="width:${pct}%"></div></div>
          <span class="prob-val">${Math.round(pct)}%</span>
        </div>`;
      }
    }
  }

  /* Footer */
  let footerHtml = '';
  const tagsHtml = `<div class="tags">
    ${hasDLS && !m.res ? `<span class="tag tag-dls">DLS</span>` : ''}
    ${hasSO ? `<span class="tag tag-so">SUPER OVER</span>` : ''}
    ${hasTV ? `<span class="tag-tv">📺</span>` : ''}
  </div>`;

  if (odds) {
    footerHtml = `<div class="card-footer">
      <div class="odds-wrap">
        <div class="odds-item"><span class="odds-lbl">Back</span><span class="odds-val odds-back">${odds.back||'-'}</span></div>
        <div class="odds-item"><span class="odds-lbl">Lay</span><span class="odds-val odds-lay">${odds.lay||'-'}</span></div>
      </div>
      ${tagsHtml}
    </div>`;
  } else if (tagsHtml.replace(/<[^>]+>/g,'').trim()) {
    footerHtml = `<div class="card-footer"><div></div>${tagsHtml}</div>`;
  }

  return `<div class="match-card">
    <div class="card-top">
      <span class="match-meta">${m.fo||'Cricket'} · ${m.e||id}</span>
      ${pillHtml}
    </div>
    <div class="teams">
      ${teamRow(homeCode, homeS1, homeS2, homeIsBat, status==='completed' && !homeIsBat)}
      <div class="team-divider"></div>
      ${teamRow(awayCode, awayS1, awayS2, awayIsBat, status==='completed' && !awayIsBat)}
    </div>
    ${statusHtml}
    ${probHtml}
    ${footerHtml}
  </div>`;
}

/* ── Group by series ── */
function groupBySeries(entries) {
  const groups = {};
  entries.forEach(([id, m]) => {
    const key = (m.fo || 'Cricket') + '||' + (m.cn || 'Other Matches');
    if (!groups[key]) groups[key] = { fo: m.fo||'Cricket', cn: m.cn||'Other Matches', matches: [] };
    groups[key].matches.push([id, m]);
  });
  return groups;
}

/* ── Render ── */
function render(data, tab) {
  const entries = Object.entries(data);
  const container = document.getElementById('matches-container');

  const live      = entries.filter(([,m]) => { const s=getStatus(m.d,m.ifs); return s==='live'||s==='inplay'; });
  const upcoming  = entries.filter(([,m]) => getStatus(m.d,m.ifs)==='upcoming');
  const completed = entries.filter(([,m]) => getStatus(m.d,m.ifs)==='completed');

  // Update live tab count
  document.getElementById('tc-live').textContent = `(${live.length})`;

  let filtered;
  if (tab === 'live')      filtered = live;
  else if (tab === 'upcoming') filtered = upcoming;
  else if (tab === 'finished') filtered = completed;
  else filtered = entries; // foryou = all

  if (!filtered.length) {
    container.innerHTML = `<div class="no-matches">No matches for this filter.</div>`;
    return;
  }

  const groups = groupBySeries(filtered);
  let html = '';

  Object.entries(groups).forEach(([key, g]) => {
    const isOpen = openGroups[key] !== false; // default open
    html += `<div class="series-group">
      <div class="series-header" onclick="toggleGroup('${CSS.escape(key)}')">
        <div class="series-left">
          <div class="series-icon">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><circle cx="12" cy="12" r="9" fill="#d63031" opacity=".15"/><circle cx="12" cy="12" r="9" stroke="#d63031" stroke-width="1.5"/><path d="M8 10c.5-2 4-3 7-2M16 14c-.5 2-4 3-7 2" stroke="#d63031" stroke-width="1.2" stroke-linecap="round"/></svg>
          </div>
          <span class="series-name">${g.cn}</span>
        </div>
        <span class="series-chevron${isOpen?' open':''}" id="chev-${CSS.escape(key)}">▼</span>
      </div>
      <div id="grp-${CSS.escape(key)}" style="display:${isOpen?'block':'none'}">
        ${g.matches.map(([id, m]) => buildCard(id, m)).join('')}
      </div>
    </div>`;
  });

  container.innerHTML = html;
}

function toggleGroup(key) {
  const body = document.getElementById('grp-' + key);
  const chev = document.getElementById('chev-' + key);
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  openGroups[key] = !isOpen;
  if (chev) chev.classList.toggle('open', !isOpen);
}

function setTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const tabMap = { foryou: 0, live: 1, upcoming: 2, finished: 3 };
  document.querySelectorAll('.tab')[tabMap[t] || 0].classList.add('active');
  if (Object.keys(allData).length) render(allData, t);
}

async function loadAll() {
  document.getElementById('loader').style.display = 'flex';
  document.getElementById('error-box').style.display = 'none';
  document.getElementById('matches-container').style.display = 'none';

  try {
    // Load teams and matches in parallel
    await loadTeams();
    const r = await fetch(MATCHES_API);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    allData = await r.json();

    document.getElementById('loader').style.display = 'none';
    document.getElementById('matches-container').style.display = 'block';
    render(allData, activeTab);
  } catch(e) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('error-msg').textContent = e.message;
  }
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
