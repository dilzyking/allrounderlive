<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Match Scorecard – CREX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2128;
  --bg4: #21262d;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #484f58;
  --live: #f85149;
  --live-bg: rgba(248,81,73,0.12);
  --green: #3fb950;
  --green-bg: rgba(63,185,80,0.12);
  --blue: #58a6ff;
  --blue-bg: rgba(88,166,255,0.1);
  --gold: #e3b341;
  --gold-bg: rgba(227,179,65,0.12);
  --purple: #bc8cff;
  --purple-bg: rgba(188,140,255,0.12);
  --orange: #f0883e;
  --orange-bg: rgba(240,136,62,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 13px;
}

/* ── NAV ── */
.top-nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
  display: flex; align-items: center; gap: 12px;
  height: 52px;
}
.back-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2); flex-shrink: 0;
}
.nav-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-logo { font-size: 16px; font-weight: 700; letter-spacing: 1px; color: var(--text); }

/* ── HERO SCORECARD ── */
.hero {
  background: linear-gradient(180deg, #161b22 0%, #0d1117 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 14px 0;
}
.series-label {
  font-size: 10px; color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.8px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.series-label span { color: var(--blue); }

.match-teams {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px;
}
.team-hero { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.team-flag-lg {
  width: 52px; height: 52px; border-radius: 12px;
  overflow: hidden; background: var(--bg3);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
}
.team-flag-lg img { width: 100%; height: 100%; object-fit: cover; }
.flag-txt-lg { font-size: 10px; font-weight: 700; color: var(--text3); }
.team-name-lg { font-size: 11px; font-weight: 600; color: var(--text); text-align: center; line-height: 1.3; }
.team-score-lg { font-size: 22px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.team-overs-lg { font-size: 10px; color: var(--text3); }

.vs-block { text-align: center; flex-shrink: 0; }
.vs-txt { font-size: 11px; color: var(--text3); font-weight: 500; }
.vs-status { font-size: 9px; margin-top: 4px; }

.result-banner {
  background: var(--green-bg);
  border: 1px solid rgba(63,185,80,0.25);
  border-radius: 8px;
  padding: 8px 12px;
  text-align: center;
  font-size: 12px; font-weight: 600; color: var(--green);
  margin-bottom: 10px;
}
.result-banner.live-banner { background: var(--live-bg); border-color: rgba(248,81,73,0.25); color: var(--live); }
.result-banner.upcoming-banner { background: var(--blue-bg); border-color: rgba(88,166,255,0.25); color: var(--blue); }

/* Live info bar */
.live-info {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
  border-top: 1px solid var(--border);
}
.live-batters { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.live-batter-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.live-batter-row .name { color: var(--text); font-weight: 500; flex: 1; }
.live-batter-row .stat { color: var(--text3); min-width: 50px; text-align: right; }
.on-strike { color: var(--gold) !important; }
.live-bowler { text-align: right; font-size: 11px; }
.live-bowler .lbl { color: var(--text3); margin-bottom: 2px; }
.live-bowler .val { color: var(--text); font-weight: 500; }

/* Recent overs */
.recent-overs-wrap { padding: 8px 14px 10px; border-bottom: 1px solid var(--border); }
.section-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px; }
.recent-overs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.recent-overs::-webkit-scrollbar { display: none; }
.over-group { display: flex; flex-direction: column; gap: 3px; align-items: center; flex-shrink: 0; }
.over-num { font-size: 9px; color: var(--text3); }
.balls-row { display: flex; gap: 3px; }
.ball {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700;
  background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border);
}
.ball.six { background: var(--purple-bg); color: var(--purple); border-color: rgba(188,140,255,0.3); }
.ball.four { background: var(--blue-bg); color: var(--blue); border-color: rgba(88,166,255,0.3); }
.ball.wicket { background: var(--live-bg); color: var(--live); border-color: rgba(248,81,73,0.3); }
.ball.wide, .ball.nb { background: var(--orange-bg); color: var(--orange); border-color: rgba(240,136,62,0.3); }
.ball.dot { color: var(--text3); }

/* Win Probability */
.prob-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.prob-teams { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; }
.prob-t1 { color: var(--blue); font-weight: 600; }
.prob-t2 { color: var(--orange); font-weight: 600; }
.prob-bar-wrap { height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; display: flex; }
.prob-fill-1 { background: var(--blue); transition: width 0.6s; }
.prob-fill-2 { background: var(--orange); flex: 1; }

/* ── TABS ── */
.tabs {
  display: flex; overflow-x: auto; scrollbar-width: none;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  position: sticky; top: 52px; z-index: 90;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 11px 16px;
  font-size: 12px; font-weight: 500; color: var(--text2);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s; white-space: nowrap;
}
.tab.active { color: var(--text); border-bottom-color: #e03131; }

/* ── PANEL ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── INNINGS TABS ── */
.inn-tabs {
  display: flex; background: var(--bg2); border-bottom: 1px solid var(--border);
}
.inn-tab {
  flex: 1; padding: 9px 8px; text-align: center;
  font-size: 11px; font-weight: 500; color: var(--text2);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.inn-tab.active { color: var(--text); border-bottom-color: var(--blue); }

/* ── SCORECARD TABLE ── */
.sc-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.sc-section-head {
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.8px;
  margin-bottom: 8px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between;
}
.sc-table { width: 100%; border-collapse: collapse; }
.sc-table thead th {
  font-size: 9px; color: var(--text3); font-weight: 500;
  text-align: right; padding: 3px 0; text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sc-table thead th:first-child { text-align: left; }
.sc-table tbody tr { border-top: 1px solid var(--border); }
.sc-table tbody td {
  padding: 7px 0; font-size: 12px; color: var(--text2);
  text-align: right; vertical-align: top;
}
.sc-table tbody td:first-child { text-align: left; }
.player-cell { display: flex; flex-direction: column; gap: 1px; }
.player-name { font-size: 12px; font-weight: 600; color: var(--text); }
.player-name.batting-now { color: var(--gold); }
.player-name.not-out { color: var(--green); }
.dismissal { font-size: 10px; color: var(--text3); line-height: 1.4; max-width: 160px; }
.runs-val { font-size: 13px; font-weight: 700; color: var(--text); }
.runs-val.high { color: var(--gold); }
.extras-row td { color: var(--text2); font-size: 11px; padding-top: 8px; }
.total-row td { font-weight: 700; color: var(--text); border-top: 1px solid var(--border2); padding-top: 8px; }

/* Bowler table */
.bowl-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.bowl-table thead th {
  font-size: 9px; color: var(--text3); font-weight: 500;
  text-align: right; padding: 3px 0; text-transform: uppercase; letter-spacing: 0.5px;
}
.bowl-table thead th:first-child { text-align: left; }
.bowl-table tbody tr { border-top: 1px solid var(--border); }
.bowl-table tbody td { padding: 7px 0; font-size: 12px; color: var(--text2); text-align: right; }
.bowl-table tbody td:first-child { text-align: left; font-weight: 500; color: var(--text); }
.wickets-val { font-weight: 700; color: var(--live); }

/* Yet to bat */
.ytb-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.ytb-chip {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px;
  font-size: 11px; color: var(--text2);
}

/* Partnerships */
.partner-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.partner-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.partner-info { flex: 1; }
.partner-names { font-size: 11px; font-weight: 600; color: var(--text); }
.partner-runs { font-size: 11px; color: var(--text2); }
.partner-bar-wrap { width: 100px; height: 5px; border-radius: 3px; background: var(--bg3); overflow: hidden; }
.partner-bar-fill { height: 100%; border-radius: 3px; background: var(--blue); }

/* ── MATCH INFO ── */
.info-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.info-row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.info-row:last-child { border-bottom: none; }
.info-icon { font-size: 14px; flex-shrink: 0; width: 20px; text-align: center; }
.info-lbl { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
.info-val { font-size: 12px; color: var(--text); font-weight: 500; }
.weather-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 8px; }
.weather-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
.weather-val { font-size: 13px; font-weight: 700; color: var(--text); }
.weather-lbl { font-size: 9px; color: var(--text3); margin-top: 2px; }

/* ── PLAYING XI ── */
.xi-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.xi-team-head { font-size: 12px; font-weight: 700; color: var(--text); margin: 10px 0 6px; }
.xi-player {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; border-bottom: 1px solid var(--border);
}
.xi-player:last-child { border-bottom: none; }
.xi-num { font-size: 10px; color: var(--text3); width: 18px; flex-shrink: 0; }
.xi-name { flex: 1; font-size: 12px; font-weight: 500; color: var(--text); }
.xi-badges { display: flex; gap: 4px; }
.xi-badge {
  font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px;
}
.badge-c { background: var(--gold-bg); color: var(--gold); }
.badge-wk { background: var(--blue-bg); color: var(--blue); }
.badge-role { background: var(--bg3); color: var(--text3); }

/* ── STANDINGS ── */
.standings-table { width: 100%; border-collapse: collapse; }
.standings-table thead th {
  font-size: 9px; color: var(--text3); text-align: right; padding: 6px 4px;
  text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500;
}
.standings-table thead th:first-child { text-align: left; }
.standings-table tbody tr { border-top: 1px solid var(--border); }
.standings-table tbody tr.highlight { background: rgba(88,166,255,0.06); }
.standings-table tbody td { padding: 8px 4px; font-size: 12px; color: var(--text2); text-align: right; }
.standings-table tbody td:first-child { text-align: left; font-weight: 600; color: var(--text); }
.form-dots { display: flex; gap: 3px; justify-content: flex-end; }
.form-dot { width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700; }
.form-w { background: var(--green-bg); color: var(--green); }
.form-l { background: var(--live-bg); color: var(--live); }

/* ── LOADER ── */
#loader {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 0; gap: 14px;
}
.ball-loader {
  width: 42px; height: 42px; border-radius: 50%;
  background: radial-gradient(circle at 38% 38%, #ff6b6b, #c0392b);
  position: relative; animation: spin 0.9s linear infinite;
}
.ball-loader::before, .ball-loader::after {
  content: ''; position: absolute;
  border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
}
.ball-loader::before { top:4px;left:4px;right:4px;bottom:17px; }
.ball-loader::after { top:17px;left:4px;right:4px;bottom:4px; }
@keyframes spin { to { transform: rotate(360deg); } }
#loader p { color: var(--text3); font-size: 12px; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bot-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 9px 4px; cursor: pointer;
  color: var(--text3); font-size: 9px; gap: 3px;
}
.bot-item.active { color: var(--text); }
.bot-icon { font-size: 18px; }

/* ── MAIN CONTENT ── */
.content { padding-bottom: 70px; }

/* ── ODDS SECTION ── */
.odds-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.odds-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.odds-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.odds-card-lbl { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.odds-card-val { font-size: 16px; font-weight: 700; }
.odds-back-val { color: var(--green); }
.odds-lay-val { color: var(--live); }

/* ── OVER PROJECTIONS ── */
.proj-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.proj-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 8px; }
.proj-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
.proj-over { font-size: 9px; color: var(--text3); margin-bottom: 2px; }
.proj-range { font-size: 12px; font-weight: 700; color: var(--text); }

/* section label */
.sec-label {
  font-size: 11px; font-weight: 700; color: var(--text);
  padding: 12px 14px 0;
  display: block;
}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="top-nav">
  <div class="back-btn" onclick="history.back()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
  </div>
  <span class="nav-title" id="nav-title">Loading…</span>
  <span class="nav-logo">CREX</span>
</div>

<!-- LOADER -->
<div id="loader">
  <div class="ball-loader"></div>
  <p>Loading match data…</p>
</div>

<!-- CONTENT -->
<div class="content" id="content" style="display:none">

  <!-- HERO -->
  <div class="hero" id="hero-block"></div>

  <!-- RECENT OVERS -->
  <div class="recent-overs-wrap" id="recent-overs-block" style="display:none">
    <div class="section-lbl">Recent Overs</div>
    <div class="recent-overs" id="recent-overs"></div>
  </div>

  <!-- WIN PROBABILITY -->
  <div class="prob-section" id="prob-block" style="display:none">
    <div class="section-lbl" style="margin-bottom:6px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px">Win Probability</div>
    <div class="prob-teams">
      <span class="prob-t1" id="prob-t1-name"></span>
      <span class="prob-t2" id="prob-t2-name"></span>
    </div>
    <div class="prob-bar-wrap">
      <div class="prob-fill-1" id="prob-fill" style="width:50%"></div>
      <div class="prob-fill-2"></div>
    </div>
    <div class="prob-teams" style="margin-top:4px;font-size:10px">
      <span id="prob-pct1" style="color:var(--blue)"></span>
      <span id="prob-pct2" style="color:var(--orange)"></span>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" onclick="showTab('scorecard')">Scorecard</div>
    <div class="tab" onclick="showTab('matchinfo')">Match Info</div>
    <div class="tab" onclick="showTab('playingxi')">Playing XI</div>
    <div class="tab" onclick="showTab('standings')">Standings</div>
    <div class="tab" onclick="showTab('odds')">Odds</div>
  </div>

  <!-- SCORECARD PANEL -->
  <div class="panel active" id="panel-scorecard">
    <div class="inn-tabs" id="inn-tabs"></div>
    <div id="innings-content"></div>
  </div>

  <!-- MATCH INFO PANEL -->
  <div class="panel" id="panel-matchinfo">
    <div class="info-section" id="info-content"></div>
  </div>

  <!-- PLAYING XI PANEL -->
  <div class="panel" id="panel-playingxi">
    <div class="xi-section" id="xi-content"></div>
  </div>

  <!-- STANDINGS PANEL -->
  <div class="panel" id="panel-standings">
    <div class="info-section" id="standings-content"></div>
  </div>

  <!-- ODDS PANEL -->
  <div class="panel" id="panel-odds">
    <div class="odds-section" id="odds-content"></div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="bot-item active"><div class="bot-icon">🏠</div><span>Home</span></div>
  <div class="bot-item"><div class="bot-icon">🏆</div><span>Series</span></div>
  <div class="bot-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="#d63031"/><path d="M7 10c1-3 6-5 10-3M17 14c-1 3-6 5-10 3" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg><span style="color:var(--text)">Matches</span></div>
  <div class="bot-item"><div class="bot-icon">👥</div><span>Social</span></div>
  <div class="bot-item"><div class="bot-icon">▶️</div><span>Videos</span></div>
</div>

<script>
const PROXY = 'https://crictv.cricketstream745.workers.dev/?url=';
const TEAMS_API = 'https://crex-api-dillzy.sayanwork-studioo.workers.dev/teams';

// Extract match ID from URL param or default
const urlParams = new URLSearchParams(window.location.search);
const MATCH_ID = urlParams.get('match') || '126W';
const BASE = `https://indiancricket.fun/api/match/${MATCH_ID}`;

let teamsMap = {}, liveData = {}, scorecardData = {}, statsData = {};
let activeInnings = 0;

/* ── Helpers ── */
function teamFlag(code) {
  const t = teamsMap[code];
  const url = t ? t.flag : null;
  const disp = (code || '??').toString().slice(0,3).toUpperCase();
  if (url) return `<div class="team-flag-lg"><img src="${url}" alt="${disp}" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=flag-txt-lg>${disp}</span>'"></div>`;
  return `<div class="team-flag-lg"><span class="flag-txt-lg">${disp}</span></div>`;
}
function teamFlagSm(code) {
  const t = teamsMap[code];
  const url = t ? t.flag : null;
  const disp = (code||'??').toString().slice(0,3).toUpperCase();
  if (url) return `<div class="team-flag-wrap"><img src="${url}" alt="${disp}" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=flag-txt>${disp}</span>'"></div>`;
  return `<div class="team-flag-wrap"><span class="flag-txt">${disp}</span></div>`;
}

function sr(runs, balls) {
  if (!balls || balls == 0) return '0.00';
  return ((runs/balls)*100).toFixed(1);
}
function eco(runs, overs) {
  if (!overs || overs == '0') return '0.00';
  const [o, b='0'] = overs.toString().split('.');
  const totalBalls = parseInt(o)*6 + parseInt(b);
  if (!totalBalls) return '0.00';
  return (runs / (totalBalls/6)).toFixed(2);
}

/* ── Render Hero ── */
function renderHero() {
  const l = liveData, st = statsData;
  const t1code = l.team1Code, t2code = l.team2Code;
  const t1name = l.team1Name || t1code;
  const t2name = l.team2Name || t2code;

  document.getElementById('nav-title').textContent = `${l.team1ShortName||t1code} vs ${l.team2ShortName||t2code}`;

  // Result/status banner
  let bannerHtml = '';
  const bs = l.ballStatus || l.result || '';
  if (bs) {
    const cls = l.isLive ? 'live-banner' : l.isFinished ? '' : 'upcoming-banner';
    bannerHtml = `<div class="result-banner ${cls}">${bs}</div>`;
  }

  // Live batter/bowler
  let liveInfoHtml = '';
  if (l.isLive && l.striker) {
    const str = l.striker, nstr = l.nonStriker, bowl = l.bowler;
    liveInfoHtml = `<div class="live-info">
      <div class="live-batters">
        ${str ? `<div class="live-batter-row">
          <span class="name on-strike">⚈ ${str.name}</span>
          <span class="stat">${str.runs}(${str.balls})</span>
        </div>` : ''}
        ${nstr ? `<div class="live-batter-row">
          <span class="name">${nstr.name}</span>
          <span class="stat">${nstr.runs}(${nstr.balls})</span>
        </div>` : ''}
      </div>
      ${bowl ? `<div class="live-bowler">
        <div class="lbl">Bowling</div>
        <div class="val">${bowl.name}</div>
        <div class="lbl">${bowl.wickets}/${bowl.runs} (${bowl.overs})</div>
      </div>` : ''}
    </div>`;
  }

  // Series/venue
  const seriesTxt = st.s || l.seriesName || '';
  const fmt = l.format || st.fo || '';
  const venueTxt = st.venueName || l.matchInfo?.venue || l.venue || 'TBD';

  document.getElementById('hero-block').innerHTML = `
    <div class="series-label">
      <span>${seriesTxt}</span> · ${fmt} · Match ${MATCH_ID}
    </div>
    <div class="match-teams">
      <div class="team-hero">
        ${teamFlag(t1code)}
        <div class="team-name-lg">${t1name}</div>
        <div class="team-score-lg">${l.team1Score || '—'}</div>
        <div class="team-overs-lg">${l.team1Overs ? `(${l.team1Overs} ov)` : ''}</div>
      </div>
      <div class="vs-block">
        <div class="vs-txt">VS</div>
        ${l.isLive ? '<div class="vs-status" style="color:var(--live)">● LIVE</div>' : ''}
      </div>
      <div class="team-hero">
        ${teamFlag(t2code)}
        <div class="team-name-lg">${t2name}</div>
        <div class="team-score-lg">${l.team2Score || '—'}</div>
        <div class="team-overs-lg">${l.team2Overs ? `(${l.team2Overs} ov)` : ''}</div>
      </div>
    </div>
    ${bannerHtml}
    <div style="font-size:10px;color:var(--text3);padding-bottom:10px">📍 ${venueTxt}</div>
    ${liveInfoHtml}
  `;
}

/* ── Render Recent Overs ── */
function renderRecentOvers() {
  const overs = liveData.recentOvers;
  if (!overs || !overs.length) return;
  document.getElementById('recent-overs-block').style.display = 'block';
  const html = overs.map(ov => {
    const balls = ov.balls.map(b => {
      let cls = 'ball';
      if (b === '6') cls += ' six';
      else if (b === '4') cls += ' four';
      else if (b === 'W') cls += ' wicket';
      else if (b === 'wd' || b === 'nb') cls += ' wide';
      else if (b === '0') cls += ' dot';
      return `<div class="${cls}">${b}</div>`;
    }).join('');
    return `<div class="over-group">
      <div class="over-num">Ov ${ov.overNumber}</div>
      <div class="balls-row">${balls}</div>
    </div>`;
  }).join('');
  document.getElementById('recent-overs').innerHTML = html;
}

/* ── Win Probability ── */
function renderProbability() {
  const prob = liveData.probability;
  let pct = 50;
  if (prob) pct = prob;
  else if (statsData.flb) {
    const p = statsData.flb.split('|');
    if (p[3]) pct = parseFloat(p[3]);
  }
  if (pct && pct > 0 && pct < 100) {
    document.getElementById('prob-block').style.display = 'block';
    document.getElementById('prob-t1-name').textContent = liveData.team1ShortName || '';
    document.getElementById('prob-t2-name').textContent = liveData.team2ShortName || '';
    document.getElementById('prob-fill').style.width = pct + '%';
    document.getElementById('prob-pct1').textContent = Math.round(pct) + '%';
    document.getElementById('prob-pct2').textContent = Math.round(100 - pct) + '%';
  }
}

/* ── Render Scorecard ── */
function renderScorecard() {
  const sc = scorecardData.scorecard;
  if (!sc || !sc.length) return;

  const teams = [liveData.team2Code, liveData.team1Code]; // inn1=team2 batting, inn2=team1
  const teamNames = [liveData.team2Name, liveData.team1Name];

  // Innings tabs
  const tabHtml = sc.map((inn, i) => {
    const name = (teamNames[i] || `Innings ${i+1}`).split(' ').slice(-1)[0];
    return `<div class="inn-tab${i===activeInnings?' active':''}" onclick="switchInnings(${i})">${name} ${i+1}st Inn</div>`;
  }).join('');
  document.getElementById('inn-tabs').innerHTML = tabHtml;

  renderInnings(activeInnings);
}

function switchInnings(idx) {
  activeInnings = idx;
  document.querySelectorAll('.inn-tab').forEach((el, i) => el.classList.toggle('active', i===idx));
  renderInnings(idx);
}

function renderInnings(idx) {
  const sc = scorecardData.scorecard;
  if (!sc || !sc[idx]) return;
  const inn = sc[idx];
  const eb = inn.enrichedBatting || [];
  const rawBowlers = inn.a || [];

  /* ── Batting ── */
  let batRows = eb.map(p => {
    const isOut = p.isOut;
    const notOut = !isOut;
    const isBatting = p.statusLabel === 'Batting';
    let dismissal = '';
    if (isBatting) dismissal = '<span style="color:var(--green);font-size:10px">Batting*</span>';
    else if (p.statusLabel === 'Not Out') dismissal = 'not out';
    else if (p.bowlerName) {
      dismissal = `b ${p.bowlerName}`;
      if (p.fielderName) dismissal = `c ${p.fielderName} b ${p.bowlerName}`;
    }
    const runsNum = parseInt(p.runs);
    const highRun = runsNum >= 50;
    return `<tr>
      <td>
        <div class="player-cell">
          <span class="player-name${isBatting?' batting-now':notOut?' not-out':''}">${p.playerName}${notOut&&!isBatting?'*':''}</span>
          <span class="dismissal">${dismissal}</span>
        </div>
      </td>
      <td class="runs-val${highRun?' high':''}">${p.runs}</td>
      <td>${p.balls}</td>
      <td>${p.fours}</td>
      <td>${p.sixes}</td>
      <td>${sr(p.runs,p.balls)}</td>
    </tr>`;
  }).join('');

  // Parse score for extras/total
  const scoreStr = inn.d || '';
  const extrasStr = inn.e || '0.0.0.0.0';
  const [nb=0, wd=0, b=0, lb=0, penalty=0] = extrasStr.split('.').map(Number);
  const totalExtras = nb+wd+b+lb+penalty;
  const scoreMatch = scoreStr.match(/^(\d+)\/(\d+)\((\d+)/);
  let totalRuns = '-', totalWkts = '-', totalOvers = '-';
  if (scoreMatch) { totalRuns=scoreMatch[1]; totalWkts=scoreMatch[2]; totalOvers=scoreMatch[3]; }

  /* ── Bowlers ── */
  // Parse bowler data from raw: code.overs.runs.wickets.maidens...
  // Need to map from the opposite innings' batting data
  // Bowlers are in the 'a' field: "4FG.32.47.1.3" = code.overs.balls.wickets.maidens? 
  // Actually from API: a = bowler stats: code.runs.balls.4s.6s
  // b = batting: code.runs.balls.4s.6s...
  // Let's use the bowler codes from the opposite innings batting dismissals
  const bowlerMap = {};
  eb.forEach(p => {
    if (p.bowlerName && p.bowlerId) {
      if (!bowlerMap[p.bowlerId]) bowlerMap[p.bowlerId] = { name: p.bowlerName, wickets: 0, runs: 0 };
      if (p.isOut) bowlerMap[p.bowlerId].wickets++;
    }
  });

  // Parse 'a' array for bowler figures: code.runs.balls.wkts.maidens
  const bowlerRows = rawBowlers.map(raw => {
    const parts = raw.split('.');
    const code = parts[0];
    const bName = bowlerMap[code] ? bowlerMap[code].name : (scorecardData.playerNames?.[code] || code);
    const runs = parts[1] || '0';
    const balls = parseInt(parts[2] || '0');
    const wkts = parts[3] || '0';
    const maidens = parts[4] || '0';
    const overs = Math.floor(balls/6) + (balls%6 ? '.'+(balls%6) : '.0');
    const ecoVal = balls > 0 ? ((parseInt(runs)/(balls/6))).toFixed(2) : '0.00';
    return `<tr>
      <td>${bName}</td>
      <td>${overs}</td>
      <td>${maidens}</td>
      <td>${runs}</td>
      <td class="wickets-val">${wkts}</td>
      <td>${ecoVal}</td>
    </tr>`;
  }).join('');

  /* ── Yet to bat ── */
  let ytbHtml = '';
  if (inn.yetToBat && inn.yetToBat.length) {
    const names = inn.yetToBat.map(p => {
      const name = scorecardData.playerNames?.[p.playerCode] || p.playerCode;
      return `<div class="ytb-chip">${name}</div>`;
    }).join('');
    ytbHtml = `<div><div class="sec-label" style="padding:10px 14px 6px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px">Yet to Bat</div><div class="ytb-row">${names}</div></div>`;
  }

  /* ── Partnerships ── */
  let partnerHtml = '';
  if (inn.p && inn.p.length) {
    const maxRuns = Math.max(...inn.p.map(pr => parseInt(pr.split('.')[6]||0)));
    const rows = inn.p.map(pr => {
      const parts = pr.split('.');
      const b1 = scorecardData.playerNames?.[parts[0]] || parts[0];
      const b2 = scorecardData.playerNames?.[parts[2]] || parts[2];
      const r1 = parts[1], r2 = parts[3];
      const total = parseInt(parts[6]||0);
      const balls = parseInt(parts[7]||0);
      const pct = maxRuns ? (total/maxRuns)*100 : 0;
      return `<div class="partner-row">
        <div class="partner-info">
          <div class="partner-names">${b1} & ${b2}</div>
          <div class="partner-runs">${total} runs (${balls} balls) · ${b1}: ${r1}, ${b2}: ${r2}</div>
        </div>
        <div class="partner-bar-wrap"><div class="partner-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
    partnerHtml = `<div class="partner-section">
      <div class="sc-section-head">Partnerships</div>
      ${rows}
    </div>`;
  }

  document.getElementById('innings-content').innerHTML = `
    <div class="sc-section">
      <table class="sc-table">
        <thead><tr>
          <th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th>
        </tr></thead>
        <tbody>
          ${batRows}
          <tr class="extras-row"><td colspan="5">Extras (nb:${nb} w:${wd} b:${b} lb:${lb})</td><td>${totalExtras}</td></tr>
          <tr class="total-row"><td colspan="3">Total</td><td colspan="3" style="text-align:right">${totalRuns}/${totalWkts} (${totalOvers} Ov)</td></tr>
        </tbody>
      </table>
    </div>
    ${ytbHtml}
    <div class="sc-section">
      <div class="sc-section-head" style="margin-bottom:8px">Bowling</div>
      <table class="bowl-table">
        <thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Eco</th></tr></thead>
        <tbody>${bowlerRows}</tbody>
      </table>
    </div>
    ${partnerHtml}
  `;
}

/* ── Match Info ── */
function renderMatchInfo() {
  const l = liveData, st = statsData;
  const wx = st.wU || {};
  const mi = l.matchInfo || {};

  let weatherHtml = '';
  if (wx.wC) {
    weatherHtml = `
      <div class="info-row">
        <div class="info-icon">🌤</div>
        <div>
          <div class="info-lbl">Weather</div>
          <div class="info-val">${wx.wC}</div>
          <div class="weather-grid">
            <div class="weather-card"><div class="weather-val">${wx.mxT||'—'}</div><div class="weather-lbl">Max Temp</div></div>
            <div class="weather-card"><div class="weather-val">${wx.hum||'—'}%</div><div class="weather-lbl">Humidity</div></div>
            <div class="weather-card"><div class="weather-val">${wx.rP||'—'}%</div><div class="weather-lbl">Rain Prob</div></div>
          </div>
        </div>
      </div>`;
  }

  // Head to head
  const hth = st.hth || '';
  let hthHtml = '';
  if (hth) {
    const [t1p, t2p] = hth.split('-');
    hthHtml = `<div class="info-row">
      <div class="info-icon">⚔️</div>
      <div>
        <div class="info-lbl">Head to Head</div>
        <div class="info-val">${l.team1ShortName||''} ${t1p} – ${t2p} ${l.team2ShortName||''}</div>
      </div>
    </div>`;
  }

  // Toss
  let tossHtml = l.tossResult ? `<div class="info-row"><div class="info-icon">🪙</div><div><div class="info-lbl">Toss</div><div class="info-val">${l.tossResult}</div></div></div>` : '';

  // Points table from ptt
  const ptt = st.ptt || '';
  let pttHtml = '';
  if (ptt) {
    const teams = ptt.split('|').map(t => {
      const p = t.split('^');
      return { code: p[0], m: p[1], w: p[2], l: p[3], nrr: p[4], pts: p[6] };
    });
    const rows = teams.map(t => `<tr class="${t.code===l.team1Code||t.code===l.team2Code?'highlight':''}">
      <td>${teamsMap[t.code]?.shortName||t.code}</td>
      <td>${t.m}</td><td>${t.w}</td><td>${t.l}</td><td>${t.nrr}</td><td style="font-weight:700;color:var(--text)">${t.pts}</td>
    </tr>`).join('');
    pttHtml = `<div style="margin-top:10px">
      <div class="sc-section-head">Points Table</div>
      <table class="standings-table">
        <thead><tr><th>Team</th><th>M</th><th>W</th><th>L</th><th>NRR</th><th>Pts</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  // Over projections
  const va = st.va || {};
  let projHtml = '';
  const projOvers = Object.entries(va).filter(([k]) => k !== 'd');
  if (projOvers.length) {
    const cards = projOvers.map(([k, v]) => `<div class="proj-card">
      <div class="proj-over">Ov ${k}</div>
      <div class="proj-range">${v}</div>
    </div>`).join('');
    projHtml = `<div class="proj-section"><div class="sc-section-head">Over-by-Over Projections</div><div class="proj-grid">${cards}</div></div>`;
  }

  document.getElementById('info-content').innerHTML = `
    <div class="info-row">
      <div class="info-icon">📍</div>
      <div><div class="info-lbl">Venue</div><div class="info-val">${st.venueName||l.venue||'TBD'}</div></div>
    </div>
    <div class="info-row">
      <div class="info-icon">📅</div>
      <div><div class="info-lbl">Date & Time</div><div class="info-val">${mi.date||new Date(l.timestamp).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
    </div>
    <div class="info-row">
      <div class="info-icon">🏏</div>
      <div><div class="info-lbl">Format</div><div class="info-val">${l.format||''}</div></div>
    </div>
    ${tossHtml}
    ${hthHtml}
    ${weatherHtml}
    ${pttHtml}
  `;

  // Also render projections separately
  if (projOvers.length) {
    document.getElementById('info-content').insertAdjacentHTML('afterend', projHtml);
  }
}

/* ── Playing XI ── */
function renderPlayingXI() {
  const xi = liveData.playingXI;
  if (!xi) return;
  function renderTeam(players, teamName) {
    const rows = players.map((p, i) => {
      const badges = [];
      if (p.isCaptain) badges.push(`<span class="xi-badge badge-c">C</span>`);
      if (p.isWicketKeeper) badges.push(`<span class="xi-badge badge-wk">WK</span>`);
      if (p.role) badges.push(`<span class="xi-badge badge-role">${p.role}</span>`);
      return `<div class="xi-player">
        <div class="xi-num">${i+1}</div>
        <div class="xi-name">${p.name}</div>
        <div class="xi-badges">${badges.join('')}</div>
      </div>`;
    }).join('');
    return `<div class="xi-team-head">🏏 ${teamName}</div>${rows}`;
  }
  document.getElementById('xi-content').innerHTML =
    renderTeam(xi.team1||[], liveData.team1Name||'Team 1') +
    '<div style="height:16px;border-top:1px solid var(--border);margin:10px 0"></div>' +
    renderTeam(xi.team2||[], liveData.team2Name||'Team 2');
}

/* ── Standings ── */
function renderStandings() {
  const ptt = statsData.ptt || '';
  if (!ptt) { document.getElementById('standings-content').innerHTML = '<div style="padding:20px;color:var(--text3);text-align:center">No standings data</div>'; return; }
  const teams = ptt.split('|').map(t => {
    const p = t.split('^');
    return { code: p[0], m: p[1], w: p[2], l: p[3], nrr: p[4], pts: p[6] };
  });
  const rows = teams.map(t => {
    const sn = teamsMap[t.code]?.shortName || t.code;
    return `<tr class="${t.code===liveData.team1Code||t.code===liveData.team2Code?'highlight':''}">
      <td>${sn}</td>
      <td>${t.m}</td><td>${t.w}</td><td>${t.l}</td>
      <td style="color:${parseFloat(t.nrr||0)>=0?'var(--green)':'var(--live)'}">${t.nrr}</td>
      <td style="font-weight:700;color:var(--text)">${t.pts}</td>
    </tr>`;
  }).join('');
  document.getElementById('standings-content').innerHTML = `
    <div class="sc-section-head">${statsData.s||'Series'} Standings</div>
    <table class="standings-table">
      <thead><tr><th>Team</th><th>M</th><th>W</th><th>L</th><th>NRR</th><th>Pts</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/* ── Odds ── */
function renderOdds() {
  const flb = statsData.flb;
  let html = '<div class="sc-section-head">Betting Odds</div>';
  if (flb) {
    const p = flb.split('|');
    const back = parseFloat(p[1]||0), lay = parseFloat(p[2]||0), pct = parseFloat(p[3]||50);
    html += `<div class="odds-cards">
      <div class="odds-card"><div class="odds-card-lbl">Back (${liveData.team1ShortName||'T1'})</div><div class="odds-card-val odds-back-val">${back||'—'}</div></div>
      <div class="odds-card"><div class="odds-card-lbl">Lay (${liveData.team2ShortName||'T2'})</div><div class="odds-card-val odds-lay-val">${lay||'—'}</div></div>
    </div>
    <div style="margin-top:12px;font-size:11px;color:var(--text3)">Win probability based on odds</div>
    <div style="margin-top:6px;display:flex;justify-content:space-between;font-size:11px;font-weight:600">
      <span style="color:var(--blue)">${liveData.team1ShortName||''} ${Math.round(pct)}%</span>
      <span style="color:var(--orange)">${liveData.team2ShortName||''} ${Math.round(100-pct)}%</span>
    </div>
    <div style="margin-top:4px;height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;display:flex">
      <div style="width:${pct}%;background:var(--blue)"></div>
      <div style="flex:1;background:var(--orange)"></div>
    </div>`;
  } else {
    html += '<div style="padding:20px 0;color:var(--text3);text-align:center">No odds available</div>';
  }
  document.getElementById('odds-content').innerHTML = html;
}

/* ── Tab switch ── */
function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const tabs = ['scorecard','matchinfo','playingxi','standings','odds'];
  const idx = tabs.indexOf(name);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

/* ── Load All ── */
async function loadAll() {
  try {
    const [teamsRes, liveRes, scRes, stRes] = await Promise.all([
      fetch(TEAMS_API),
      fetch(`${BASE}/live`),
      fetch(`${PROXY}${encodeURIComponent(BASE + '/scorecard')}`),
      fetch(`${PROXY}${encodeURIComponent(BASE + '/stats')}`)
    ]);

    teamsMap = await teamsRes.json();
    liveData = await liveRes.json();
    scorecardData = await scRes.json();
    statsData = await stRes.json();

    document.getElementById('loader').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    renderHero();
    renderRecentOvers();
    renderProbability();
    renderScorecard();
    renderMatchInfo();
    renderPlayingXI();
    renderStandings();
    renderOdds();

  } catch(e) {
    document.getElementById('loader').innerHTML = `<div style="color:var(--live);text-align:center;padding:20px">
      <div style="font-size:16px;margin-bottom:8px">⚠ Failed to load</div>
      <div style="font-size:12px;color:var(--text3)">${e.message}</div>
      <button onclick="loadAll()" style="margin-top:16px;background:var(--live-bg);color:var(--live);border:1px solid var(--live);border-radius:8px;padding:8px 20px;font-size:13px;cursor:pointer;font-family:inherit">Retry</button>
    </div>`;
  }
}

loadAll();
</script>
